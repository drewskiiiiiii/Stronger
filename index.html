<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STRONGER Strength Training Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        html, body { overflow-x: hidden; max-width: 100%; }
        .min-h-screen { min-height: 100vh; min-height: 100dvh; }
        input[type=date] { color-scheme: dark; }
        input, select, textarea { font-size: 16px; } /* prevents iOS Safari zoom-on-focus */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
        @supports(padding: max(0px)) {
            .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 16px); }
            .safe-top { padding-top: max(env(safe-area-inset-top), 12px); }
        }
    </style>
</head>
<body class="bg-[#080E16] text-[#F3F6FA] min-h-screen flex flex-col antialiased selection:bg-[#1685F8] selection:text-white">

    <div id="root" class="flex flex-col min-h-screen"></div>

    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="pdf-import.js"></script>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const IMAGES = {
            benchPress: 'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=300&q=80',
            pullUps: 'https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=300&q=80',
            overheadPress: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=300&q=80',
            barbellRow: 'https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=300&q=80',
            heroDeadlift: 'https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=1200&q=80',
            squat: 'https://images.unsplash.com/photo-1574680096145-d05b474e2155?auto=format&fit=crop&w=300&q=80',
            inclineDumbbell: 'https://images.unsplash.com/photo-1534367507873-d2d7e24c797f?auto=format&fit=crop&w=300&q=80',
            romanianDeadlift: 'https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?auto=format&fit=crop&w=300&q=80',
            legRaises: 'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=300&q=80'
        };

        const INITIAL_EXERCISES = [
            { id: 'ex-bench', name: 'Barbell Bench Press', shortName: 'Bench Press', primaryMuscle: 'Chest', equipment: 'Barbell', pattern: 'Horizontal Push', thumbnail: IMAGES.benchPress },
            { id: 'ex-pullup', name: 'Weighted Pull-Ups', shortName: 'Pull-Up', primaryMuscle: 'Back', equipment: 'Pull-Up Bar', pattern: 'Vertical Pull', thumbnail: IMAGES.pullUps },
            { id: 'ex-db-ohp', name: 'DB Overhead Press', shortName: 'DB OHP', primaryMuscle: 'Shoulders', equipment: 'Dumbbells', pattern: 'Vertical Push', thumbnail: IMAGES.overheadPress },
            { id: 'ex-row', name: 'Barbell Row', shortName: 'Barbell Row', primaryMuscle: 'Back', equipment: 'Barbell', pattern: 'Horizontal Pull', thumbnail: IMAGES.barbellRow },
            { id: 'ex-leg-raise', name: 'Hanging Leg Raises', shortName: 'Leg Raises', primaryMuscle: 'Core', equipment: 'Pull-Up Bar', pattern: 'Core Flexion', thumbnail: IMAGES.legRaises },
            { id: 'ex-deadlift', name: 'Deadlift', shortName: 'Deadlift', primaryMuscle: 'Posterior Chain', equipment: 'Barbell', pattern: 'Hip Hinge', thumbnail: IMAGES.heroDeadlift },
            { id: 'ex-ohp', name: 'Overhead Press', shortName: 'OHP', primaryMuscle: 'Shoulders', equipment: 'Barbell', pattern: 'Vertical Push', thumbnail: IMAGES.overheadPress },
            { id: 'ex-squat', name: 'Barbell Back Squat', shortName: 'Squat', primaryMuscle: 'Quadriceps', equipment: 'Barbell', pattern: 'Squat', thumbnail: IMAGES.squat },
            { id: 'ex-incline-db', name: 'Incline Dumbbell Press', shortName: 'Incline DB Press', primaryMuscle: 'Chest', equipment: 'Dumbbells', pattern: 'Horizontal Push', thumbnail: IMAGES.inclineDumbbell },
            { id: 'ex-rdl', name: 'Romanian Deadlift', shortName: 'RDL', primaryMuscle: 'Hamstrings', equipment: 'Barbell', pattern: 'Hip Hinge', thumbnail: IMAGES.romanianDeadlift },
            { id: 'ex-db-row', name: 'Single-Arm DB Row', shortName: 'DB Row', primaryMuscle: 'Back', equipment: 'Dumbbells', pattern: 'Horizontal Pull', thumbnail: IMAGES.barbellRow },
            { id: 'ex-goblet-squat', name: 'Goblet Squat', shortName: 'Goblet Squat', primaryMuscle: 'Quadriceps', equipment: 'Dumbbells', pattern: 'Squat', thumbnail: IMAGES.squat },
            { id: 'ex-db-rdl', name: 'Dumbbell RDL', shortName: 'DB RDL', primaryMuscle: 'Hamstrings', equipment: 'Dumbbells', pattern: 'Hip Hinge', thumbnail: IMAGES.romanianDeadlift },
            { id: 'ex-pushup', name: 'Deficit Tempo Push-Ups', shortName: 'Push-Up', primaryMuscle: 'Chest', equipment: 'Bodyweight', pattern: 'Horizontal Push', thumbnail: IMAGES.benchPress },
            { id: 'ex-split-squat', name: 'Bulgarian Split Squat', shortName: 'Split Squat', primaryMuscle: 'Quadriceps', equipment: 'Dumbbells', pattern: 'Squat', thumbnail: IMAGES.squat },
            { id: 'ex-plank-reach', name: 'Hollow Body Hold', shortName: 'Core Hold', primaryMuscle: 'Core', equipment: 'Bodyweight', pattern: 'Core Flexion', thumbnail: IMAGES.legRaises }
        ];

        const THEMES = {
            blue: { name: 'Athletic Blue', bgPrimary: '#080E16', bgSecondary: '#0D1622', bgCard: '#101C2B', bgElevated: '#142235', border: '#203147', accent: '#1685F8', accentHover: '#2992FF', textPrimary: '#F3F6FA', textSecondary: '#A4B3C5', success: '#31D583' },
            emerald: { name: 'Volt Emerald', bgPrimary: '#090E14', bgSecondary: '#0F1722', bgCard: '#12202E', bgElevated: '#182A3D', border: '#22384D', accent: '#10B981', accentHover: '#059669', textPrimary: '#F0FDF4', textSecondary: '#94A3B8', success: '#34D399' },
            crimson: { name: 'Crimson Force', bgPrimary: '#0B0A0C', bgSecondary: '#141217', bgCard: '#1E1B22', bgElevated: '#28242E', border: '#3B3542', accent: '#F43F5E', accentHover: '#E11D48', textPrimary: '#FFF1F2', textSecondary: '#A1A1AA', success: '#31D583' },
            gold: { name: 'Titan Gold', bgPrimary: '#0D0C0A', bgSecondary: '#161410', bgCard: '#211E18', bgElevated: '#2C2821', border: '#3F3930', accent: '#F59E0B', accentHover: '#D97706', textPrimary: '#FFFBEB', textSecondary: '#A8A29E', success: '#31D583' },
            violet: { name: 'Cyber Violet', bgPrimary: '#0A0812', bgSecondary: '#120F1D', bgCard: '#1A162B', bgElevated: '#241F3B', border: '#362F54', accent: '#8B5CF6', accentHover: '#7C3AED', textPrimary: '#F5F3FF', textSecondary: '#A78BFA', success: '#31D583' }
        };

        const INITIAL_PROGRAM = {
            name: '12 Week Strength Builder',
            totalWeeks: 12,
            currentWeek: 4,
            phase: 'Phase 2 · Intensification',
            days: [
                { id: 'day-1', name: 'Upper Body Strength', emphasis: 'Push · Pull · Core', durationMin: 60, location: 'Gym', exercises: [
                    { exerciseId: 'ex-bench', sets: 4, reps: 5, targetWeightLb: 225, restSeconds: 180, completed: false },
                    { exerciseId: 'ex-pullup', sets: 4, reps: 6, targetWeightLb: 10, restSeconds: 120, completed: false, isWeightedAddition: true },
                    { exerciseId: 'ex-db-ohp', sets: 3, reps: 8, targetWeightLb: 65, restSeconds: 90, completed: false },
                    { exerciseId: 'ex-row', sets: 3, reps: 8, targetWeightLb: 185, restSeconds: 90, completed: false },
                    { exerciseId: 'ex-leg-raise', sets: 3, reps: 12, targetWeightLb: 0, restSeconds: 60, completed: false }
                ]},
                { id: 'day-2', name: 'Lower Body Power', emphasis: 'Squat · Hinge · Posterior', durationMin: 65, location: 'Gym', exercises: [
                    { exerciseId: 'ex-squat', sets: 4, reps: 5, targetWeightLb: 315, restSeconds: 180, completed: false },
                    { exerciseId: 'ex-rdl', sets: 3, reps: 8, targetWeightLb: 245, restSeconds: 120, completed: false },
                    { exerciseId: 'ex-db-row', sets: 3, reps: 10, targetWeightLb: 80, restSeconds: 90, completed: false }
                ]},
                { id: 'day-3', name: 'Hypertrophy & Accessories', emphasis: 'Shoulders · Arms · Back', durationMin: 55, location: 'Gym', exercises: [
                    { exerciseId: 'ex-ohp', sets: 4, reps: 6, targetWeightLb: 145, restSeconds: 120, completed: false },
                    { exerciseId: 'ex-incline-db', sets: 3, reps: 10, targetWeightLb: 75, restSeconds: 90, completed: false },
                    { exerciseId: 'ex-pullup', sets: 3, reps: 8, targetWeightLb: 0, restSeconds: 90, completed: false }
                ]}
            ]
        };

        const INITIAL_WORKOUT_LOGS = [
            { id: 'log-1', date: '2026-09-20', workoutName: 'Upper Body Strength', durationMin: 58, totalVolumeLb: 18450, exercises: [
                { exerciseId: 'ex-bench', name: 'Barbell Bench Press', sets: [{ setNumber: 1, weight: 225, reps: 5, rpe: 8 }, { setNumber: 2, weight: 225, reps: 5, rpe: 8.5 }, { setNumber: 3, weight: 225, reps: 5, rpe: 9 }, { setNumber: 4, weight: 225, reps: 5, rpe: 9.5 }] }
            ]}
        ];

        // ---- Program library components ----
        const intensityLabel = (i) => i ? (i.type === 'RPE' ? `RPE ${i.raw}` : i.type === '%1RM' ? `${i.raw} 1RM` : i.raw) : 'unspecified';
        const STATUS_META = {
            not_started: { label: 'Not Started', cls: 'bg-[#142235] text-[#8FA2B8]' },
            in_progress: { label: 'In Progress', cls: 'bg-[#1685F8]/20 text-[#1685F8]' },
            paused: { label: 'Paused', cls: 'bg-[#F59E0B]/20 text-[#F59E0B]' },
            completed: { label: 'Completed', cls: 'bg-[#31D583]/20 text-[#31D583]' }
        };
        const StatusBadge = ({ status }) => {
            const m = STATUS_META[status] || STATUS_META.not_started;
            return <span className={`px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wide ${m.cls}`}>{m.label}</span>;
        };

        const ProgramCard = ({ program, state, isActive, onOpen }) => {
            const m = program.metadata;
            const flagged = program.flags.length;
            return (
                <button onClick={onOpen} className="w-full text-left bg-[#101C2B] border border-[#203147] rounded-2xl p-4 space-y-2.5 active:bg-[#142235]">
                    <div className="flex items-start justify-between gap-2">
                        <h3 className="text-sm font-black text-white leading-snug">{program.name}</h3>
                        <StatusBadge status={state.status} />
                    </div>
                    <div className="flex flex-wrap gap-1.5 text-[11px] text-[#8FA2B8]">
                        {m.totalWeeks && <span className="px-2 py-0.5 rounded-md bg-[#080E16] border border-[#203147]">{m.totalWeeks} weeks</span>}
                        {m.daysPerWeek && <span className="px-2 py-0.5 rounded-md bg-[#080E16] border border-[#203147]">{m.daysPerWeek} days/week</span>}
                        {m.split && <span className="px-2 py-0.5 rounded-md bg-[#080E16] border border-[#203147]">{m.split}</span>}
                        {m.level && <span className="px-2 py-0.5 rounded-md bg-[#080E16] border border-[#203147]">{m.level}</span>}
                    </div>
                    <div className="flex items-center justify-between text-[11px]">
                        {isActive ? <span className="font-bold text-[#31D583]">● Active program</span> : <span className="text-[#8FA2B8]">Level, focus &amp; equipment: unspecified in source</span>}
                        {flagged > 0 && <span className="text-[#F59E0B] font-semibold">⚠ {flagged} to review</span>}
                    </div>
                </button>
            );
        };

        const ProgramDetail = ({ program, state, isActive, unit, onBack, onRemove, children }) => {
            const [week, setWeek] = useState(program.weeks[0] ? program.weeks[0].week : 1);
            const [showFlags, setShowFlags] = useState(false);
            const [openSection, setOpenSection] = useState(null);
            const wk = program.weeks.find(w => w.week === week);
            const m = program.metadata;
            return (
                <div className="space-y-4">
                    <button onClick={onBack} className="min-h-[44px] text-xs font-bold text-[#1685F8]">‹ Program Library</button>
                    <div className="space-y-1.5">
                        <div className="flex items-start justify-between gap-2">
                            <h2 className="text-lg font-black text-white leading-snug">{program.name}</h2>
                            <StatusBadge status={state.status} />
                        </div>
                        <p className="text-[11px] text-[#8FA2B8]">{[m.totalWeeks && `${m.totalWeeks} weeks`, m.daysPerWeek && `${m.daysPerWeek} training days/week`, m.split].filter(Boolean).join(' · ')}</p>
                        <p className="text-[10px] text-[#8FA2B8]">Source: {program.source.fileName} · imported {program.source.importedAt.split('T')[0]} · level, focus &amp; equipment are not stated in a structured form in the PDF</p>
                    </div>
                    {children}
                    {program.flags.length > 0 && (
                        <div className="bg-[#F59E0B]/10 border border-[#F59E0B]/30 rounded-xl p-3 space-y-2">
                            <button onClick={() => setShowFlags(!showFlags)} className="w-full min-h-[36px] flex items-center justify-between text-xs font-bold text-[#F59E0B]">
                                <span>⚠ {program.flags.length} item(s) flagged for review</span><span>{showFlags ? '▲' : '▼'}</span>
                            </button>
                            {showFlags && program.flags.map((f, i) => (
                                <div key={i} className="text-[11px] text-[#F3F6FA] leading-snug">{f.page ? <span className="text-[#8FA2B8]">p.{f.page} · </span> : null}{f.msg}</div>
                            ))}
                        </div>
                    )}
                    <div className="flex gap-2 overflow-x-auto pb-1">
                        {program.weeks.map(w => (
                            <button key={w.week} onClick={() => setWeek(w.week)} className={`min-h-[40px] px-4 rounded-xl text-xs font-bold shrink-0 border ${w.week === week ? 'bg-[#1685F8] border-[#1685F8] text-white' : 'bg-[#101C2B] border-[#203147] text-[#8FA2B8]'}`}>Week {w.week}</button>
                        ))}
                    </div>
                    {wk && wk.days.map(d => (
                        <div key={d.day} className="bg-[#101C2B] border border-[#203147] rounded-2xl p-4 space-y-3">
                            <div className="flex items-center justify-between">
                                <div><div className="text-[10px] font-bold uppercase tracking-wider text-[#1685F8]">Day {d.day}</div><h3 className="text-sm font-black text-white">{d.label}</h3></div>
                                <span className="text-[10px] text-[#8FA2B8]">PDF p.{d.page}</span>
                            </div>
                            {d.exercises.map(e => (
                                <div key={e.order} className="border-t border-[#203147] pt-2.5 space-y-1">
                                    <div className="flex items-start justify-between gap-2">
                                        <div className="text-[13px] font-bold text-white"><span className="text-[#8FA2B8] mr-1.5">{e.order}.</span>{e.name}{e.flags.length > 0 && <span className="ml-1.5 text-[#F59E0B]">⚠</span>}</div>
                                        <div className="text-[12px] font-bold text-white tabular-nums shrink-0">{e.workingSets ?? '?'} × {e.reps ?? '?'}</div>
                                    </div>
                                    <div className="text-[11px] text-[#8FA2B8]">
                                        {e.warmupSets != null ? `${e.warmupSets} warm-up set(s) · ` : ''}Intensity {intensityLabel(e.intensity)} · Rest: unspecified
                                    </div>
                                    {e.notes && <div className="text-[11px] text-[#C7D3E0] leading-snug">{e.notes}</div>}
                                </div>
                            ))}
                        </div>
                    ))}
                    {program.instructions.length > 0 && (
                        <div className="space-y-2">
                            <div className="text-xs font-bold text-white">Instructions from the PDF</div>
                            {program.instructions.map(sec => (
                                <div key={sec.page} className="bg-[#101C2B] border border-[#203147] rounded-xl">
                                    <button onClick={() => setOpenSection(openSection === sec.page ? null : sec.page)} className="w-full min-h-[44px] px-3 flex items-center justify-between text-left text-xs font-semibold text-white">
                                        <span className="truncate">{sec.lines[0]}</span><span className="text-[#8FA2B8] ml-2 shrink-0">p.{sec.page} {openSection === sec.page ? '▲' : '▼'}</span>
                                    </button>
                                    {openSection === sec.page && <div className="px-3 pb-3 text-[11px] text-[#C7D3E0] leading-relaxed whitespace-pre-line">{sec.lines.join('\n')}</div>}
                                </div>
                            ))}
                        </div>
                    )}
                    <button onClick={onRemove} className="w-full min-h-[44px] rounded-xl bg-[#142235] border border-[#203147] text-[#F43F5E] text-xs font-bold">Archive program (workout history is kept)</button>
                </div>
            );
        };

        // ---- Program scheduling helpers (pure) ----
        const pad2 = (n) => String(n).padStart(2, '0');
        const toDateStr = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
        const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return toDateStr(d); };
        const todayStr = () => toDateStr(new Date());
        const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const fmtShort = (s) => { const d = parseDate(s); return `${WEEKDAYS[d.getDay()]} ${d.getMonth() + 1}/${d.getDate()}`; };
        const normName = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
        const sessionKeyOf = (week, day) => `w${week}d${day}`;
        const defaultWeekdays = (n) => ({ 1: [1], 2: [1, 4], 3: [1, 3, 5], 4: [1, 2, 4, 5], 5: [1, 2, 3, 4, 5], 6: [1, 2, 3, 4, 5, 6], 7: [0, 1, 2, 3, 4, 5, 6] }[n] || [1, 2, 3, 4, 5, 6].slice(0, n));

        // Planned dates come from the user's start date and chosen weekdays; the program order itself is never altered.
        function buildSessions(program, prog) {
            const out = [];
            const today = todayStr();
            const weekdays = (prog.weekdays || []).slice().sort((a, b) => a - b);
            program.weeks.forEach((w, wi) => {
                const windowDates = [];
                if (prog.startDate) for (let i = 0; i < 7; i++) { const ds = addDays(prog.startDate, wi * 7 + i); if (weekdays.includes(parseDate(ds).getDay())) windowDates.push(ds); }
                w.days.forEach((d, k) => {
                    const key = sessionKeyOf(w.week, d.day);
                    const rec = (prog.sessions || {})[key] || {};
                    const status = rec.status || 'planned';
                    const basePlanned = windowDates[k] || windowDates[windowDates.length - 1] || null;
                    const plannedDate = rec.plannedDate || basePlanned;
                    out.push({ key, week: w.week, day: d.day, label: d.label, page: d.page, exercises: d.exercises, status, plannedDate,
                        rescheduled: !!rec.plannedDate && rec.plannedDate !== basePlanned, completedDate: rec.completedDate || null, logId: rec.logId || null,
                        missed: status === 'planned' && !!plannedDate && plannedDate < today });
                });
            });
            return out;
        }

        // ---- Start program sheet ----
        const StartProgramSheet = ({ program, owned, onCancel, onConfirm }) => {
            const missing = missingEquipment(program, owned);
            const need = program.metadata.daysPerWeek || 0;
            const [startDate, setStartDate] = useState(todayStr());
            const [weekdays, setWeekdays] = useState(defaultWeekdays(need));
            const toggle = (d) => setWeekdays(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d]);
            const valid = weekdays.length === need && !!startDate;
            const preview = valid ? buildSessions(program, { startDate, weekdays, sessions: {} }) : [];
            const lastDate = preview.length ? preview[preview.length - 1].plannedDate : null;
            return (
                <div className="fixed inset-0 z-[60] bg-black/80 flex items-end justify-center">
                    <div className="bg-[#101C2B] border-t border-[#203147] rounded-t-3xl max-w-lg w-full p-5 space-y-4 max-h-[88dvh] overflow-y-auto safe-bottom">
                        <div className="flex items-center justify-between">
                            <h3 className="text-sm font-bold text-white">Start: {program.name}</h3>
                            <button onClick={onCancel} aria-label="Close" className="min-w-[44px] min-h-[44px] text-[#8FA2B8]">✕</button>
                        </div>
                        <div>
                            <label className="text-[11px] text-[#8FA2B8] block mb-1">Start date</label>
                            <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full min-h-[44px] bg-[#080E16] border border-[#203147] rounded-xl px-3 text-white" />
                        </div>
                        <div>
                            <label className="text-[11px] text-[#8FA2B8] block mb-1">Training weekdays — choose {need} (the PDF does not say which days)</label>
                            <div className="grid grid-cols-7 gap-1.5">
                                {WEEKDAYS.map((n, d) => (
                                    <button key={d} onClick={() => toggle(d)} className={`min-h-[44px] rounded-lg text-[11px] font-bold border ${weekdays.includes(d) ? 'bg-[#1685F8] border-[#1685F8] text-white' : 'bg-[#080E16] border-[#203147] text-[#8FA2B8]'}`}>{n}</button>
                                ))}
                            </div>
                            {!valid && <div className="text-[11px] text-[#F59E0B] mt-1.5">Select exactly {need} days ({weekdays.length} selected).</div>}
                        </div>
                        {missing.length > 0 && (
                            <div className="bg-[#F59E0B]/10 border border-[#F59E0B]/30 rounded-xl p-3 space-y-1">
                                <div className="text-[11px] font-bold text-[#F59E0B]">Equipment you haven't marked as available (estimated from exercise names)</div>
                                {missing.map(m => <div key={m.equipment} className="text-[11px] text-white"><span className="font-bold">{m.equipment}:</span> {m.exercises.join(', ')}</div>)}
                                <div className="text-[10px] text-[#8FA2B8]">You can substitute individual exercises during the workout. Update “My equipment” in Settings if this is wrong.</div>
                            </div>
                        )}
                        {valid && (
                            <div className="space-y-1.5">
                                <div className="text-xs font-bold text-white">Calendar preview · ends {fmtShort(lastDate)}</div>
                                <div className="bg-[#080E16] border border-[#203147] rounded-xl p-3 max-h-48 overflow-y-auto space-y-1">
                                    {preview.map(s => <div key={s.key} className="flex justify-between text-[11px]"><span className="text-[#8FA2B8]">{fmtShort(s.plannedDate)}</span><span className="text-white">W{s.week} D{s.day} · {s.label}</span></div>)}
                                </div>
                                <p className="text-[10px] text-[#8FA2B8]">Other days are rest days. Workouts never advance or complete just because a date passes.</p>
                            </div>
                        )}
                        <button disabled={!valid} onClick={() => onConfirm({ startDate, weekdays: weekdays.slice().sort((a, b) => a - b) })} className="w-full min-h-[48px] rounded-xl bg-[#1685F8] text-white text-sm font-black disabled:opacity-40">Start Program</button>
                    </div>
                </div>
            );
        };

        // ---- Calendar ----
        const CalendarView = ({ program, prog, sessions, logs, hasActiveWorkout, onStart, onReschedule, onSkip, onUnskip, onOpenProgram }) => {
            const firstPending = sessions.find(x => x.status === 'planned' && x.plannedDate);
            const initialDate = firstPending ? firstPending.plannedDate : todayStr();
            const [month, setMonth] = useState(() => { const t = parseDate(initialDate); return new Date(t.getFullYear(), t.getMonth(), 1); });
            const [selected, setSelected] = useState(initialDate);
            const today = todayStr();
            const first = month.getDay();
            const dim = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
            const cells = [];
            for (let i = 0; i < first; i++) cells.push(null);
            for (let d = 1; d <= dim; d++) cells.push(`${month.getFullYear()}-${pad2(month.getMonth() + 1)}-${pad2(d)}`);
            const byDate = {};
            sessions.forEach(s => { const k = s.status === 'completed' && s.completedDate ? s.completedDate : s.plannedDate; if (k) (byDate[k] = byDate[k] || []).push(s); });
            const logDates = new Set(logs.map(l => l.date));
            const nextKey = (sessions.find(s => s.status === 'planned') || {}).key;
            const dotCls = (s) => s.status === 'completed' ? 'bg-[#31D583]' : s.status === 'skipped' ? 'bg-[#8FA2B8]' : s.missed ? 'bg-[#F43F5E]' : 'bg-[#1685F8]';
            const daySessions = byDate[selected] || [];
            const doneCount = sessions.filter(s => s.status === 'completed').length;
            const nextSession = sessions.find(s => s.status === 'planned');
            const wkNow = nextSession ? nextSession.week : (program ? program.weeks.length : 0);
            return (
                <div className="space-y-4">
                    <h2 className="text-lg font-black text-white">Calendar</h2>
                    {!program ? (
                        <div className="bg-[#101C2B] border border-dashed border-[#203147] rounded-2xl p-5 text-center space-y-3">
                            <p className="text-xs text-[#8FA2B8]">No program is active. Start one from the Program Library to see its schedule here.</p>
                            <button onClick={onOpenProgram} className="min-h-[44px] px-5 rounded-xl bg-[#1685F8] text-white text-xs font-bold">Open Program Library</button>
                        </div>
                    ) : (
                        <div className="bg-[#101C2B] border border-[#203147] rounded-2xl p-4 space-y-1">
                            <div className="text-[10px] font-bold uppercase tracking-wider text-[#1685F8]">Active program</div>
                            <div className="text-sm font-black text-white">{program.name}</div>
                            <div className="text-[11px] text-[#8FA2B8]">Week {wkNow} of {program.weeks.length} · {doneCount}/{sessions.length} workouts completed</div>
                        </div>
                    )}
                    <div className="bg-[#101C2B] border border-[#203147] rounded-2xl p-3">
                        <div className="flex items-center justify-between mb-2">
                            <button aria-label="Previous month" onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() - 1, 1))} className="min-w-[44px] min-h-[44px] text-white text-lg">‹</button>
                            <div className="text-sm font-bold text-white">{month.toLocaleString(undefined, { month: 'long', year: 'numeric' })}</div>
                            <button aria-label="Next month" onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() + 1, 1))} className="min-w-[44px] min-h-[44px] text-white text-lg">›</button>
                        </div>
                        <div className="grid grid-cols-7 text-center text-[10px] text-[#8FA2B8] mb-1">{WEEKDAYS.map(w => <div key={w}>{w}</div>)}</div>
                        <div className="grid grid-cols-7 gap-1">
                            {cells.map((ds, i) => ds ? (
                                <button key={ds} onClick={() => setSelected(ds)} className={`min-h-[46px] rounded-lg flex flex-col items-center justify-center gap-1 text-xs font-semibold border ${selected === ds ? 'border-[#1685F8] bg-[#1685F8]/10' : 'border-transparent'} ${ds === today ? 'text-[#1685F8]' : 'text-white'}`}>
                                    <span>{parseInt(ds.slice(8), 10)}</span>
                                    <span className="flex gap-0.5 h-1.5">
                                        {(byDate[ds] || []).slice(0, 3).map(s => <span key={s.key} className={`w-1.5 h-1.5 rounded-full ${dotCls(s)}`}></span>)}
                                        {!(byDate[ds] || []).length && logDates.has(ds) && <span className="w-1.5 h-1.5 rounded-full bg-white/60"></span>}
                                    </span>
                                </button>
                            ) : <div key={`e${i}`}></div>)}
                        </div>
                        <div className="flex flex-wrap gap-x-3 gap-y-1 mt-2 text-[10px] text-[#8FA2B8]">
                            <span><span className="inline-block w-2 h-2 rounded-full bg-[#1685F8] mr-1"></span>Scheduled</span>
                            <span><span className="inline-block w-2 h-2 rounded-full bg-[#31D583] mr-1"></span>Completed</span>
                            <span><span className="inline-block w-2 h-2 rounded-full bg-[#F43F5E] mr-1"></span>Missed</span>
                            <span><span className="inline-block w-2 h-2 rounded-full bg-[#8FA2B8] mr-1"></span>Skipped</span>
                        </div>
                    </div>
                    <div className="space-y-2">
                        <div className="text-xs font-bold text-white">{fmtShort(selected)}{selected === today ? ' · Today' : ''}</div>
                        {daySessions.length === 0 && <div className="text-[11px] text-[#8FA2B8]">{program ? 'Rest day — no program workout scheduled.' : 'Nothing scheduled.'}</div>}
                        {daySessions.map(s => (
                            <div key={s.key} className="bg-[#101C2B] border border-[#203147] rounded-xl p-3 space-y-2">
                                <div className="flex items-start justify-between gap-2">
                                    <div>
                                        <div className="text-sm font-bold text-white">{s.label}</div>
                                        <div className="text-[11px] text-[#8FA2B8]">Week {s.week} · Day {s.day} · {s.exercises.length} exercises</div>
                                        {s.rescheduled && <div className="text-[10px] text-[#F59E0B]">Rescheduled</div>}
                                        {s.status === 'completed' && <div className="text-[10px] text-[#31D583]">Completed {s.completedDate}{s.completedDate !== s.plannedDate ? ` (planned ${s.plannedDate})` : ''}</div>}
                                        {s.missed && <div className="text-[10px] text-[#F43F5E]">Missed — still pending; nothing was skipped automatically</div>}
                                        {s.status === 'skipped' && <div className="text-[10px] text-[#8FA2B8]">Skipped by you</div>}
                                    </div>
                                    {s.key === nextKey && <span className="text-[10px] font-bold text-[#1685F8] uppercase">Up next</span>}
                                </div>
                                {s.status === 'planned' && (
                                    <div className="flex flex-wrap items-center gap-2">
                                        <button onClick={() => onStart(s)} className="min-h-[44px] px-4 rounded-xl bg-[#1685F8] text-white text-xs font-bold">{hasActiveWorkout ? 'Return to workout' : 'Start workout'}</button>
                                        <label className="min-h-[44px] px-3 rounded-xl bg-[#142235] border border-[#203147] text-white text-xs font-bold flex items-center gap-2">Move to
                                            <input type="date" value={s.plannedDate || ''} onChange={e => e.target.value && onReschedule(s, e.target.value)} className="bg-transparent text-white w-[130px]" />
                                        </label>
                                        <button onClick={() => onSkip(s)} className="min-h-[44px] px-3 rounded-xl bg-[#142235] border border-[#203147] text-[#8FA2B8] text-xs font-bold">Skip</button>
                                    </div>
                                )}
                                {s.status === 'skipped' && <button onClick={() => onUnskip(s)} className="min-h-[44px] px-4 rounded-xl bg-[#142235] border border-[#203147] text-white text-xs font-bold">Undo skip</button>}
                            </div>
                        ))}
                        {logs.filter(l => l.date === selected).map(l => (
                            <div key={l.id} className="bg-[#101C2B] border border-[#203147] rounded-xl p-3 text-[11px] text-[#8FA2B8]"><span className="text-white font-bold">{l.workoutName}</span> · logged · {l.durationMin} min{l.programName ? ` · ${l.programName}` : ''}</div>
                        ))}
                    </div>
                </div>
            );
        };

        // ---- Exercise substitution (program workouts) ----
        const SubstituteModal = ({ item, library, onPick, onRestore, onClose }) => {
            const [q, setQ] = useState('');
            const [custom, setCustom] = useState('');
            const suggestions = item.prescribed.sourceSubstitutions || [];
            const matches = library.filter(x => (x.name + ' ' + x.equipment + ' ' + x.primaryMuscle).toLowerCase().includes(q.toLowerCase()));
            return (
                <div className="fixed inset-0 z-[60] bg-black/80 flex items-end justify-center">
                    <div className="bg-[#101C2B] border-t border-[#203147] rounded-t-3xl max-w-lg w-full p-5 space-y-4 max-h-[88dvh] overflow-y-auto safe-bottom">
                        <div className="flex items-center justify-between">
                            <h3 className="text-sm font-bold text-white">Substitute exercise</h3>
                            <button onClick={onClose} aria-label="Close" className="min-w-[44px] min-h-[44px] text-[#8FA2B8]">✕</button>
                        </div>
                        <div className="bg-[#080E16] border border-[#203147] rounded-xl p-3 text-[11px] space-y-0.5">
                            <div className="text-[#8FA2B8]">Prescribed (stays on record)</div>
                            <div className="text-white font-bold">{item.name} · {item.prescribed.workingSets ?? '?'} × {item.prescribed.reps ?? '?'}</div>
                        </div>
                        {item.substitution && <button onClick={onRestore} className="w-full min-h-[44px] rounded-xl bg-[#142235] border border-[#31D583]/40 text-[#31D583] text-xs font-bold">Restore original: {item.name}</button>}
                        {suggestions.length > 0 && (
                            <div className="space-y-1.5">
                                <div className="text-[11px] font-bold text-white">Alternatives listed in the program PDF</div>
                                {suggestions.map(n => <button key={n} onClick={() => onPick({ name: n, exerciseId: (library.find(x => normName(x.name) === normName(n)) || {}).id || null, origin: 'program-pdf' })} className="w-full text-left min-h-[44px] px-3 rounded-xl bg-[#080E16] border border-[#203147] text-xs text-white">{n}</button>)}
                            </div>
                        )}
                        <div className="space-y-1.5">
                            <div className="text-[11px] font-bold text-white">Your exercise library <span className="text-[#8FA2B8] font-normal">(not verified as equivalent — your choice)</span></div>
                            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search by name, equipment, muscle" className="w-full min-h-[44px] bg-[#080E16] border border-[#203147] rounded-xl px-3 text-white" />
                            <div className="max-h-44 overflow-y-auto space-y-1.5">
                                {matches.map(x => <button key={x.id} onClick={() => onPick({ name: x.name, exerciseId: x.id, origin: 'library' })} className="w-full text-left min-h-[44px] px-3 rounded-xl bg-[#080E16] border border-[#203147] text-xs text-white flex justify-between gap-2"><span>{x.name}</span><span className="text-[#8FA2B8]">{x.equipment}</span></button>)}
                                {matches.length === 0 && <div className="text-[11px] text-[#8FA2B8]">No match. Type a custom exercise below.</div>}
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <input value={custom} onChange={e => setCustom(e.target.value)} placeholder="Custom exercise name" className="flex-1 min-h-[44px] bg-[#080E16] border border-[#203147] rounded-xl px-3 text-white" />
                            <button disabled={!custom.trim()} onClick={() => onPick({ name: custom.trim(), exerciseId: null, origin: 'custom' })} className="min-h-[44px] px-4 rounded-xl bg-[#1685F8] text-white text-xs font-bold disabled:opacity-40">Use</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ---- Equipment (estimated from exercise names; never a claim of equivalence) ----
        const EQUIPMENT_OPTIONS = ['Barbell', 'Dumbbells', 'Bench', 'Pull-Up Bar', 'Cable Machine', 'Machines', 'Swiss Ball', 'Box/Step', 'Kettlebell'];
        const DEFAULT_EQUIPMENT = ['Dumbbells', 'Bench', 'Pull-Up Bar'];
        const equipmentFor = (name) => {
            const n = (name || '').toLowerCase();
            if (/dumbbell|\bdb\b/.test(n)) return 'Dumbbells';
            if (/cable|rope|pushdown|crossover|face ?pull|lat pull/.test(n)) return 'Cable Machine';
            if (/machine|leg press|leg extension|leg curl|pec deck|t-bar|smith|hack/.test(n)) return 'Machines';
            if (/pull[- ]?up|chin[- ]?up/.test(n)) return 'Pull-Up Bar';
            if (/swiss ball/.test(n)) return 'Swiss Ball';
            if (/step up/.test(n)) return 'Box/Step';
            if (/barbell|squat|deadlift|ez bar|overhead press|bench press|\brow\b/.test(n)) return 'Barbell';
            return null;
        };
        const missingEquipment = (program, owned) => {
            const found = {};
            program.weeks.forEach(w => w.days.forEach(d => d.exercises.forEach(e => {
                const eq = equipmentFor(e.name);
                if (eq && !owned.includes(eq)) (found[eq] = found[eq] || new Set()).add(e.name);
            })));
            return Object.entries(found).map(([eq, set]) => ({ equipment: eq, exercises: [...set] }));
        };

        // ---- Program progress ----
        const ProgramProgress = ({ library, workoutLogs, unit }) => {
            const ids = Object.keys(library.progress).filter(id => library.progress[id].status !== 'not_started');
            const [sel, setSel] = useState(library.activeProgramId || ids[0] || 'all');
            const [exName, setExName] = useState('');
            const program = sel !== 'all' ? library.programs[sel] : null;
            const prog = sel !== 'all' ? library.progress[sel] : null;
            const logs = sel === 'all' ? workoutLogs : workoutLogs.filter(l => l.programId === sel);
            const sessions = program && prog ? buildSessions(program, prog) : [];
            const done = sessions.filter(x => x.status === 'completed').length;
            const skipped = sessions.filter(x => x.status === 'skipped').length;
            const toUnit = (lb) => unit === 'kg' ? lb / 2.20462 : lb;
            const byWeek = {};
            logs.forEach(l => { const k = l.week ? `W${l.week}` : l.date.slice(0, 7); byWeek[k] = (byWeek[k] || 0) + (l.totalVolumeLb || 0); });
            const weekKeys = Object.keys(byWeek);
            const maxVol = Math.max(1, ...Object.values(byWeek));
            const perf = {}; // exercise -> [{date, best}]
            logs.slice().reverse().forEach(l => l.exercises.forEach(e => {
                const work = e.sets.filter(x => x.type !== 'warmup' && x.reps > 0);
                if (!work.length) return;
                const best = work.reduce((a, b) => (b.weight || 0) > (a.weight || 0) || ((b.weight || 0) === (a.weight || 0) && b.reps > a.reps) ? b : a);
                (perf[e.name] = perf[e.name] || []).push({ date: l.date, weight: best.weight || 0, reps: best.reps, unit: best.unit || 'lb' });
            }));
            const exNames = Object.keys(perf).sort();
            const chosen = perf[exName] ? exName : exNames[0];
            const series = chosen ? perf[chosen] : [];
            const prWeight = series.length ? Math.max(...series.map(x => x.weight)) : 0;
            const deloadLines = program ? program.instructions.flatMap(sec => sec.lines.filter(l => /deload/i.test(l)).map(l => `p.${sec.page}: ${l}`)) : [];
            return (
                <div className="space-y-4">
                    <h2 className="text-lg font-black text-white">Progress</h2>
                    <select value={sel} onChange={e => setSel(e.target.value)} className="w-full min-h-[44px] bg-[#101C2B] border border-[#203147] rounded-xl px-3 text-white">
                        <option value="all">All workouts (overall history)</option>
                        {ids.map(id => <option key={id} value={id}>{library.programs[id] ? library.programs[id].name : id}</option>)}
                    </select>
                    {program && (
                        <div className="bg-[#101C2B] border border-[#203147] rounded-2xl p-4 space-y-2">
                            <div className="flex items-center justify-between"><div className="text-sm font-black text-white">{program.name}</div><StatusBadge status={prog.status} /></div>
                            <div className="text-[11px] text-[#8FA2B8]">Week {(sessions.find(x => x.status === 'planned') || { week: program.weeks.length }).week} of {program.weeks.length} · {done} of {sessions.length} workouts completed{skipped ? ` · ${skipped} skipped` : ''}</div>
                            <div className="w-full bg-[#080E16] h-2 rounded-full overflow-hidden"><div className="bg-[#31D583] h-full" style={{ width: `${sessions.length ? (done / sessions.length) * 100 : 0}%` }}></div></div>
                            <div className="text-[11px] text-[#8FA2B8]">{sessions.length ? Math.round((done / sessions.length) * 100) : 0}% complete</div>
                            <div className="text-[11px] text-[#8FA2B8]">Deload / progression: {deloadLines.length ? deloadLines.join(' · ') : 'no deload instructions found in the imported text; weekly changes follow the prescriptions in the program detail.'}</div>
                        </div>
                    )}
                    <div className="bg-[#101C2B] border border-[#203147] rounded-2xl p-4 space-y-2">
                        <div className="text-xs font-bold text-white">Training volume (working sets you logged)</div>
                        {weekKeys.length === 0 ? <div className="text-[11px] text-[#8FA2B8]">No logged workouts yet.</div> : (
                            <div className="h-32 flex items-end gap-2">
                                {weekKeys.map(k => <div key={k} className="flex-1 flex flex-col items-center justify-end h-full gap-1">
                                    <div className="w-full bg-[#1685F8] rounded-t-sm" style={{ height: `${Math.max(4, (byWeek[k] / maxVol) * 80)}%` }}></div>
                                    <div className="text-[9px] text-[#8FA2B8]">{k}</div></div>)}
                            </div>
                        )}
                        {weekKeys.length > 0 && <div className="text-[10px] text-[#8FA2B8]">Total {Math.round(toUnit(Object.values(byWeek).reduce((a, b) => a + b, 0))).toLocaleString()} {unit}</div>}
                    </div>
                    <div className="bg-[#101C2B] border border-[#203147] rounded-2xl p-4 space-y-2">
                        <div className="text-xs font-bold text-white">Exercise performance</div>
                        {exNames.length === 0 ? <div className="text-[11px] text-[#8FA2B8]">Log a workout to see exercise trends.</div> : (<>
                            <select value={chosen} onChange={e => setExName(e.target.value)} className="w-full min-h-[44px] bg-[#080E16] border border-[#203147] rounded-xl px-3 text-white">{exNames.map(n => <option key={n} value={n}>{n}</option>)}</select>
                            {series.map((x, i) => <div key={i} className="flex justify-between text-[11px]"><span className="text-[#8FA2B8]">{x.date}</span><span className="text-white tabular-nums">{x.weight} {x.unit} × {x.reps}{x.weight === prWeight && prWeight > 0 && series.length > 1 ? ' · best logged' : ''}</span></div>)}
                            <div className="text-[10px] text-[#8FA2B8]">Best set per session, from your logged working sets only.</div>
                        </>)}
                    </div>
                    <div className="space-y-2">
                        <div className="text-xs font-bold text-white">Recent workouts</div>
                        {logs.length === 0 && <div className="text-[11px] text-[#8FA2B8]">Nothing logged yet.</div>}
                        {logs.slice(0, 10).map(l => (
                            <div key={l.id} className="bg-[#101C2B] border border-[#203147] rounded-xl p-3 flex justify-between gap-2">
                                <div><div className="text-xs font-bold text-white">{l.workoutName}</div><div className="text-[10px] text-[#8FA2B8]">{l.date}{l.week ? ` · Week ${l.week} Day ${l.day}` : ''}{l.programName && sel === 'all' ? ` · ${l.programName}` : ''}</div></div>
                                <div className="text-[11px] text-[#8FA2B8] text-right tabular-nums">{l.durationMin} min<br />{Math.round(toUnit(l.totalVolumeLb || 0)).toLocaleString()} {unit}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ---- Local persistence (browser localStorage only; no cloud sync) ----
        const STORE_KEY = 'stronger.state';
        const SCHEMA_VERSION = 1;
        const migrate = (data) => {
            // Future schema upgrades go here, keyed on data.schemaVersion.
            return data;
        };
        const loadStore = () => {
            try {
                const raw = localStorage.getItem(STORE_KEY);
                return raw ? migrate(JSON.parse(raw)) : {};
            } catch (e) { return {}; }
        };
        const STORED = loadStore();
        const fmtClock = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;

        function App() {
            const [activeNav, setActiveNav] = useState('Home');
            const [selectedTheme, setSelectedTheme] = useState(STORED.selectedTheme || 'blue');
            const theme = THEMES[selectedTheme];

            const [exercises, setExercises] = useState(STORED.exercises || INITIAL_EXERCISES);
            const exerciseMap = useMemo(() => {
                const map = {};
                exercises.forEach(ex => { map[ex.id] = ex; });
                return map;
            }, [exercises]);

            const [program, setProgram] = useState(STORED.program || INITIAL_PROGRAM);
            const [selectedDayId, setSelectedDayId] = useState(STORED.selectedDayId || INITIAL_PROGRAM.days[0].id);
            const todaysWorkout = program.days.find(d => d.id === selectedDayId) || program.days[0];

            const [workoutLogs, setWorkoutLogs] = useState(STORED.workoutLogs || INITIAL_WORKOUT_LOGS);
            const [userSettings, setUserSettings] = useState(STORED.userSettings || { name: 'John', unit: 'lb', targetCalories: 2400, targetProtein: 180, equipment: DEFAULT_EQUIPMENT });

            const [activeSession, setActiveSession] = useState(STORED.activeSession || null);
            // Workout view is a layer over the app; the session itself lives here regardless of the page shown.
            const [workoutOpen, setWorkoutOpen] = useState(false);
            const [confirmDiscard, setConfirmDiscard] = useState(false);
            // Timers derive from timestamps so they stay accurate when Safari is backgrounded or the phone locks.
            const [now, setNow] = useState(Date.now());
            const [restEndsAt, setRestEndsAt] = useState(STORED.restEndsAt || null);
            const timerSeconds = restEndsAt ? Math.max(0, Math.ceil((restEndsAt - now) / 1000)) : 0;
            const timerRunning = timerSeconds > 0;
            const startRest = (sec) => setRestEndsAt(Date.now() + sec * 1000);
            const elapsedSeconds = activeSession ? Math.max(0, Math.floor((now - activeSession.startTime) / 1000)) : 0;
            const importInputRef = useRef(null);
            // Program library: original imported programs stay untouched; per-program progress is stored separately.
            const [library, setLibrary] = useState(STORED.library || { programs: {}, progress: {}, activeProgramId: null });
            const [openProgramId, setOpenProgramId] = useState(null);
            const [libraryQuery, setLibraryQuery] = useState('');
            const [importing, setImporting] = useState(false);
            const [importReport, setImportReport] = useState(null);
            const pdfInputRef = useRef(null);
            const progressOf = (id) => library.progress[id] || { status: 'not_started' };

            const ownedEquipment = userSettings.equipment || DEFAULT_EQUIPMENT;
            const [startSheetId, setStartSheetId] = useState(null);
            const [subModalIdx, setSubModalIdx] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState(null);
            const activeProgram = library.activeProgramId ? library.programs[library.activeProgramId] : null;
            const activeProg = activeProgram ? progressOf(library.activeProgramId) : null;
            const activeSessions = useMemo(() => activeProgram && activeProg ? buildSessions(activeProgram, activeProg) : [], [activeProgram, activeProg]);
            const nextProgramSession = activeSessions.find(x => x.status === 'planned') || null;

            const patchProgress = (id, fn) => setLibrary(prev => ({ ...prev, progress: { ...prev.progress, [id]: fn(prev.progress[id] || { status: 'not_started' }) } }));
            const askOpenWorkout = () => setConfirmDialog({ title: 'A workout is already in progress', body: 'Return to it (or discard it from inside the workout screen) before starting another.', confirmLabel: 'Return to workout', onConfirm: () => setWorkoutOpen(true) });
            const requestStartProgram = (id) => { if (activeSession) return askOpenWorkout(); setStartSheetId(id); };
            const pauseOthers = (progress, activeId, exceptId) => {
                if (activeId && activeId !== exceptId && progress[activeId] && progress[activeId].status === 'in_progress')
                    progress[activeId] = { ...progress[activeId], status: 'paused' };
            };
            const activateProgram = (id, { startDate, weekdays }) => {
                setLibrary(prev => {
                    const progress = { ...prev.progress };
                    pauseOthers(progress, prev.activeProgramId, id);
                    progress[id] = { status: 'in_progress', startDate, weekdays, sessions: {}, startedAt: new Date().toISOString() };
                    return { ...prev, progress, activeProgramId: id };
                });
                setStartSheetId(null); setOpenProgramId(null); setActiveNav('Calendar');
                triggerToast('Program started', 'Your schedule is on the Calendar.');
            };
            const resumeProgram = (id) => {
                if (activeSession && activeSession.program && activeSession.program.programId !== id) return askOpenWorkout();
                setLibrary(prev => {
                    const progress = { ...prev.progress };
                    pauseOthers(progress, prev.activeProgramId, id);
                    progress[id] = { ...progress[id], status: 'in_progress' };
                    return { ...prev, progress, activeProgramId: id };
                });
                setOpenProgramId(null); setActiveNav('Calendar');
            };
            const pauseProgram = (id) => patchProgress(id, p => ({ ...p, status: 'paused' }));
            const rescheduleSession = (sess, date) => patchProgress(library.activeProgramId, p => ({ ...p, sessions: { ...p.sessions, [sess.key]: { ...(p.sessions || {})[sess.key], plannedDate: date } } }));
            const skipSession = (sess) => setConfirmDialog({ title: `Skip ${sess.label}?`, body: 'It will be marked skipped (not completed) and the program moves on to the next workout. Nothing is logged.', confirmLabel: 'Skip workout', danger: true,
                onConfirm: () => patchProgress(library.activeProgramId, p => ({ ...p, sessions: { ...p.sessions, [sess.key]: { ...(p.sessions || {})[sess.key], status: 'skipped' } } })) });

            const lastPerformance = (name) => {
                const n = normName(name);
                for (const log of workoutLogs) {
                    const ex = log.exercises.find(e => normName(e.name) === n && e.sets.some(x => x.reps));
                    if (ex) return `${log.date}: ` + ex.sets.filter(x => x.reps && x.type !== 'warmup').map(x => `${x.weight || 0}×${x.reps}`).join(', ');
                }
                return null;
            };
            const startProgramWorkout = (sess) => {
                if (activeSession) return askOpenWorkout();
                const prog = library.programs[library.activeProgramId];
                const go = () => {
                    const exs = sess.exercises.map(e => {
                        const sets = [];
                        const mk = (type, n) => ({ id: `${sess.key}-${e.order}-${type}-${n}`, setNumber: n, type, completed: false, weight: '', reps: '', rpe: '' });
                        for (let i = 1; i <= (e.warmupSets || 0); i++) sets.push(mk('warmup', i));
                        for (let i = 1; i <= (e.workingSets || 0); i++) sets.push(mk('working', i));
                        const lib = exercises.find(x => normName(x.name) === normName(e.name));
                        return { exerciseId: lib ? lib.id : null, name: e.name, key: normName(e.name), substitution: null,
                            prescribed: { warmupSets: e.warmupSets, workingSets: e.workingSets, reps: e.reps, intensity: e.intensity, restSeconds: e.restSeconds, notes: e.notes, page: e.page, flags: e.flags, sourceSubstitutions: e.sourceSubstitutions || [] }, sets };
                    });
                    setRestEndsAt(null);
                    setActiveSession({ id: `session-${Date.now()}`, dayId: null, workoutName: sess.label, startTime: Date.now(), exercises: exs,
                        program: { programId: prog.id, programName: prog.name, week: sess.week, day: sess.day, key: sess.key, label: sess.label, plannedDate: sess.plannedDate } });
                    setWorkoutOpen(true);
                };
                const nxt = activeSessions.find(x => x.status === 'planned');
                if (nxt && nxt.key !== sess.key) setConfirmDialog({ title: 'Start out of order?', body: `Your next scheduled workout is Week ${nxt.week} Day ${nxt.day} (${nxt.label}).`, confirmLabel: 'Start anyway', onConfirm: go });
                else go();
            };
            const updateSet = (exIdx, setIdx, patch) => setActiveSession(prev => ({ ...prev, exercises: prev.exercises.map((e, i) => i !== exIdx ? e : { ...e, sets: e.sets.map((st, j) => j !== setIdx ? st : { ...st, ...patch }) }) }));
            const addSet = (exIdx) => setActiveSession(prev => ({ ...prev, exercises: prev.exercises.map((e, i) => i !== exIdx ? e : { ...e, sets: [...e.sets, { id: `${e.key}-extra-${Date.now()}`, setNumber: e.sets.filter(x => x.type === 'working').length + 1, type: 'working', extra: true, completed: false, weight: '', reps: '', rpe: '' }] }) }));
            const setSubstitution = (exIdx, sub) => { setActiveSession(prev => ({ ...prev, exercises: prev.exercises.map((e, i) => i !== exIdx ? e : { ...e, substitution: sub }) })); setSubModalIdx(null); };
            const toggleProgramSet = (exIdx, setIdx) => {
                const st = activeSession.exercises[exIdx].sets[setIdx];
                if (!st.completed && !String(st.reps).trim()) { triggerToast('Enter reps first', 'Record what you actually performed before checking the set off.'); return; }
                updateSet(exIdx, setIdx, { completed: !st.completed });
            };

            const handlePdfFiles = async (fileList) => {
                const files = Array.from(fileList || []);
                if (!files.length) return;
                setImporting(true);
                const report = [];
                let next = library;
                for (const file of files) {
                    try {
                        const { programs, flags } = await window.StrongerImport.importPdfFile(file);
                        if (!programs.length) { report.push({ file: file.name, ok: false, msg: flags.map(f => f.msg).join('; ') }); continue; }
                        for (const prog of programs) {
                            const existing = next.programs[prog.id];
                            if (existing && existing.source.sha256 === prog.source.sha256) { report.push({ file: file.name, ok: false, msg: `"${prog.name}" is already in your library (identical file).` }); continue; }
                            next = { ...next, programs: { ...next.programs, [prog.id]: prog }, progress: { ...next.progress, [prog.id]: next.progress[prog.id] || { status: 'not_started' } } };
                            report.push({ file: file.name, ok: true, msg: `${existing ? 'Updated' : 'Imported'} "${prog.name}" — ${prog.metadata.totalWeeks} weeks, ${prog.metadata.daysPerWeek} days/week${prog.flags.length ? `, ${prog.flags.length} item(s) flagged` : ''}.` });
                        }
                    } catch (err) { report.push({ file: file.name, ok: false, msg: err.message || String(err) }); }
                }
                setLibrary(next);
                setImportReport(report);
                setImporting(false);
            };
            const removeProgram = (id) => {
                setLibrary(prev => { const programs = { ...prev.programs }; delete programs[id]; return { ...prev, programs, activeProgramId: prev.activeProgramId === id ? null : prev.activeProgramId }; });
                setOpenProgramId(null);
            };

            const [swapModalConfig, setSwapModalConfig] = useState(null);
            const [showPlanGeneratorModal, setShowPlanGeneratorModal] = useState(false);
            const [planGenConfig, setPlanGenConfig] = useState({ weeks: 12, daysPerWeek: 4, goal: 'Powerbuilding', equipment: 'Barbell & Rack' });

            const [toast, setToast] = useState(null);
            const triggerToast = (title, message) => {
                setToast({ title, message });
                setTimeout(() => setToast(null), 3500);
            };

            const formatWeight = (lb, unit, isWeightedAddition = false) => {
                if (lb === 0) return 'Bodyweight';
                if (isWeightedAddition) {
                    if (unit === 'kg') return `+${Math.round(lb * 0.453592 * 2)/2} kg`;
                    return `+${lb} lb`;
                }
                if (unit === 'kg') return `${Math.round(lb * 0.453592)} kg`;
                return `${lb} lb`;
            };

            const getSimilarAlternatives = (sourceExerciseId, equipCategory = 'All') => {
                const source = exerciseMap[sourceExerciseId];
                if (!source) return exercises;
                return exercises.filter(ex => ex.id !== sourceExerciseId).map(ex => {
                    const samePattern = ex.pattern === source.pattern;
                    const sameMuscle = ex.primaryMuscle.toLowerCase().includes(source.primaryMuscle.toLowerCase().split(' ')[0]);
                    let matchScore = (samePattern ? 40 : 0) + (sameMuscle ? 30 : 0);
                    return { ...ex, matchScore };
                }).filter(ex => {
                    if (equipCategory === 'All') return true;
                    if (equipCategory === 'Dumbbells') return ex.equipment.toLowerCase().includes('dumbbell') || ex.equipment.toLowerCase().includes('bodyweight');
                    if (equipCategory === 'Barbell') return ex.equipment.toLowerCase().includes('barbell') || ex.equipment.toLowerCase().includes('pull-up');
                    if (equipCategory === 'Bodyweight') return ex.equipment.toLowerCase().includes('bodyweight') || ex.equipment.toLowerCase().includes('pull-up');
                    return true;
                }).sort((a,b) => b.matchScore - a.matchScore);
            };

            const convertTargetWeightForSwap = (oldWeightLb, oldEx, newEx) => {
                if (!newEx) return oldWeightLb;
                if (newEx.equipment.toLowerCase().includes('bodyweight') && !newEx.equipment.toLowerCase().includes('dumbbell')) return 0;
                const oldIsBarbell = oldEx?.equipment?.toLowerCase().includes('barbell');
                const newIsDumbbell = newEx?.equipment?.toLowerCase().includes('dumbbell');
                if (oldIsBarbell && newIsDumbbell && oldWeightLb > 0) return Math.max(20, Math.round((oldWeightLb * 0.36) / 5) * 5);
                return oldWeightLb > 0 ? oldWeightLb : 65;
            };

            const handleReplaceSingleExercise = (newExerciseId) => {
                if (!swapModalConfig) return;
                const { dayId, exerciseId, activeExIdx } = swapModalConfig;
                const oldEx = exerciseMap[exerciseId];
                const newEx = exerciseMap[newExerciseId];
                if (!newEx) return;

                if (dayId && exerciseId) {
                    setProgram(prev => ({
                        ...prev,
                        days: prev.days.map(d => {
                            if (d.id !== dayId) return d;
                            return {
                                ...d,
                                exercises: d.exercises.map(item => {
                                    if (item.exerciseId !== exerciseId) return item;
                                    const adjustedWeight = convertTargetWeightForSwap(item.targetWeightLb, oldEx, newEx);
                                    return { ...item, exerciseId: newExerciseId, targetWeightLb: adjustedWeight, isWeightedAddition: newEx.id === 'ex-pullup' };
                                })
                            };
                        })
                    }));
                }

                if (activeSession && typeof activeExIdx === 'number') {
                    setActiveSession(prev => {
                        if (!prev) return prev;
                        const updated = prev.exercises.map((item, idx) => {
                            if (idx !== activeExIdx) return item;
                            const baseSet = item.sets[0];
                            const adjustedWeight = convertTargetWeightForSwap(baseSet?.prescribedWeightLb || 135, oldEx, newEx);
                            return {
                                ...item,
                                exerciseId: newExerciseId,
                                isWeightedAddition: newEx.id === 'ex-pullup',
                                sets: item.sets.map(s => ({ ...s, prescribedWeightLb: adjustedWeight, actualWeightLb: adjustedWeight }))
                            };
                        });
                        return { ...prev, exercises: updated };
                    });
                }

                setSwapModalConfig(null);
                triggerToast(`Swapped to ${newEx.name}`, `Matched pattern and scaled target load.`);
            };

            const handleAdaptEntireWorkoutByEquipment = (targetDayId, equipmentProfileKey) => {
                const profileMap = {
                    dumbbells_only: { label: 'Dumbbells & Bench Only', location: 'Home / Hotel DBs', replacements: { 'ex-bench': 'ex-incline-db', 'ex-pullup': 'ex-db-row', 'ex-ohp': 'ex-db-ohp', 'ex-row': 'ex-db-row', 'ex-deadlift': 'ex-db-rdl', 'ex-squat': 'ex-goblet-squat', 'ex-rdl': 'ex-db-rdl', 'ex-leg-raise': 'ex-plank-reach' } },
                    bodyweight_minimal: { label: 'Bodyweight & Pull-Up Bar', location: 'Calisthenics / Travel', replacements: { 'ex-bench': 'ex-pushup', 'ex-incline-db': 'ex-pushup', 'ex-db-ohp': 'ex-pushup', 'ex-ohp': 'ex-pushup', 'ex-row': 'ex-pullup', 'ex-db-row': 'ex-pullup', 'ex-deadlift': 'ex-split-squat', 'ex-squat': 'ex-split-squat', 'ex-rdl': 'ex-split-squat', 'ex-leg-raise': 'ex-plank-reach' } },
                    barbell_rack: { label: 'Barbell & Power Rack', location: 'Barbell Garage Gym', replacements: { 'ex-incline-db': 'ex-bench', 'ex-pushup': 'ex-bench', 'ex-db-ohp': 'ex-ohp', 'ex-db-row': 'ex-row', 'ex-goblet-squat': 'ex-squat', 'ex-db-rdl': 'ex-rdl', 'ex-plank-reach': 'ex-leg-raise' } }
                };

                const chosenProfile = profileMap[equipmentProfileKey];
                if (!chosenProfile) return;

                setProgram(prev => ({
                    ...prev,
                    days: prev.days.map(d => {
                        if (d.id !== targetDayId) return d;
                        const adaptedExercises = d.exercises.map(item => {
                            const oldEx = exerciseMap[item.exerciseId];
                            const mappedId = chosenProfile.replacements[item.exerciseId] || item.exerciseId;
                            const newEx = exerciseMap[mappedId] || oldEx;
                            const newWeight = convertTargetWeightForSwap(item.targetWeightLb, oldEx, newEx);
                            return { ...item, exerciseId: mappedId, targetWeightLb: newWeight, isWeightedAddition: mappedId === 'ex-pullup' && equipmentProfileKey !== 'bodyweight_minimal' };
                        });
                        return { ...d, location: chosenProfile.location, exercises: adaptedExercises };
                    })
                }));

                setSwapModalConfig(null);
                triggerToast(`Workout Adapted: ${chosenProfile.label}`, 'All movements and target weights matched.');
            };

            const handleGeneratePlan = () => {
                const newProgramName = `${planGenConfig.weeks} Week ${planGenConfig.goal} Program`;
                const newDays = [
                    { id: 'gen-1', name: 'Upper Strength & Power', emphasis: 'Push · Pull', durationMin: 60, location: planGenConfig.equipment, exercises: [
                        { exerciseId: 'ex-bench', sets: 4, reps: 5, targetWeightLb: 225, restSeconds: 180, completed: false },
                        { exerciseId: 'ex-pullup', sets: 4, reps: 6, targetWeightLb: 10, restSeconds: 120, completed: false, isWeightedAddition: true },
                        { exerciseId: 'ex-row', sets: 3, reps: 8, targetWeightLb: 185, restSeconds: 90, completed: false }
                    ]},
                    { id: 'gen-2', name: 'Lower Posterior Chain', emphasis: 'Squat · Hinge', durationMin: 65, location: planGenConfig.equipment, exercises: [
                        { exerciseId: 'ex-squat', sets: 4, reps: 5, targetWeightLb: 315, restSeconds: 180, completed: false },
                        { exerciseId: 'ex-rdl', sets: 3, reps: 8, targetWeightLb: 245, restSeconds: 120, completed: false },
                        { exerciseId: 'ex-leg-raise', sets: 3, reps: 12, targetWeightLb: 0, restSeconds: 60, completed: false }
                    ]}
                ];

                setProgram({ name: newProgramName, totalWeeks: Number(planGenConfig.weeks), currentWeek: 1, phase: 'Phase 1 · Accumulation', days: newDays });
                setSelectedDayId(newDays[0].id);
                setShowPlanGeneratorModal(false);
                triggerToast('Program Generated', `Created ${newProgramName} successfully.`);
            };

            const startWorkoutSession = (workoutTemplate = todaysWorkout) => {
                const sessionExercises = workoutTemplate.exercises.map(item => {
                    const setsArr = [];
                    for (let i = 1; i <= item.sets; i++) {
                        setsArr.push({
                            id: `${item.exerciseId}-set-${i}-${Date.now()}`,
                            setNumber: i,
                            type: i === 1 && item.targetWeightLb >= 180 ? 'warmup' : 'working',
                            prescribedReps: item.reps,
                            prescribedWeightLb: item.targetWeightLb,
                            actualWeightLb: item.targetWeightLb,
                            actualReps: item.reps,
                            rpe: 8.0,
                            completed: false
                        });
                    }
                    return { exerciseId: item.exerciseId, restSeconds: item.restSeconds || 90, isWeightedAddition: item.isWeightedAddition || false, sets: setsArr };
                });

                if (activeSession) { setWorkoutOpen(true); triggerToast('Workout already active', 'Resume or discard your current session first.'); return; }
                setRestEndsAt(null);
                setActiveSession({ id: `session-${Date.now()}`, dayId: workoutTemplate.id, workoutName: workoutTemplate.name, startTime: Date.now(), exercises: sessionExercises });
                setWorkoutOpen(true);
                triggerToast('Workout Started', `Live tracking active for ${workoutTemplate.name}.`);
            };

            useEffect(() => {
                if (!activeSession && !restEndsAt) return;
                const tick = () => setNow(Date.now());
                const interval = setInterval(tick, 1000);
                document.addEventListener('visibilitychange', tick);
                return () => { clearInterval(interval); document.removeEventListener('visibilitychange', tick); };
            }, [!!activeSession, !!restEndsAt]);

            // Persist everything incrementally (including the in-progress session).
            useEffect(() => {
                try {
                    localStorage.setItem(STORE_KEY, JSON.stringify({
                        schemaVersion: SCHEMA_VERSION,
                        selectedTheme, program, selectedDayId, workoutLogs, userSettings, exercises, activeSession, restEndsAt, library
                    }));
                } catch (e) { /* storage full or unavailable */ }
            }, [selectedTheme, program, selectedDayId, workoutLogs, userSettings, exercises, activeSession, restEndsAt, library]);

            const exportBackup = () => {
                const data = { app: 'STRONGER', exportedAt: new Date().toISOString(), ...loadStore() };
                const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
                const a = document.createElement('a');
                a.href = url; a.download = `stronger-backup-${new Date().toISOString().split('T')[0]}.json`;
                a.click(); URL.revokeObjectURL(url);
            };
            const importBackup = (file) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const d = migrate(JSON.parse(reader.result));
                        if (d.app !== 'STRONGER' && !d.workoutLogs) throw new Error('not a STRONGER backup');
                        localStorage.setItem(STORE_KEY, JSON.stringify(d));
                        location.reload();
                    } catch (e) { triggerToast('Restore failed', 'That file is not a valid STRONGER backup.'); }
                };
                reader.readAsText(file);
            };

            const finishActiveWorkout = () => {
                if (!activeSession) return;
                if (activeSession.program) return finishProgramWorkout();
                let totalVol = 0;
                activeSession.exercises.forEach(ex => {
                    ex.sets.forEach(s => {
                        if (s.completed && s.type === 'working') totalVol += (s.actualWeightLb || 0) * (s.actualReps || 0);
                    });
                });

                const newLog = {
                    id: `log-${Date.now()}`,
                    date: new Date().toISOString().split('T')[0],
                    workoutName: activeSession.workoutName,
                    durationMin: Math.max(1, Math.round(elapsedSeconds / 60)),
                    totalVolumeLb: totalVol,
                    exercises: activeSession.exercises.map(e => ({ exerciseId: e.exerciseId, name: exerciseMap[e.exerciseId]?.name || 'Exercise', sets: e.sets.map(s => ({ setNumber: s.setNumber, weight: s.actualWeightLb, reps: s.actualReps, rpe: s.rpe })) }))
                };

                setWorkoutLogs(prev => prev.some(l => l.sessionId === activeSession.id) ? prev : [{ ...newLog, sessionId: activeSession.id }, ...prev]);
                setActiveSession(null);
                setWorkoutOpen(false);
                setRestEndsAt(null);
                triggerToast('Workout Completed!', `Logged ${newLog.workoutName} with ${totalVol.toLocaleString()} lb volume.`);
            };

            const finishProgramWorkout = () => {
                const sess = activeSession;
                const unit = userSettings.unit, toLb = unit === 'kg' ? 2.20462 : 1;
                let vol = 0, doneSets = 0;
                const exLogs = sess.exercises.map(e => {
                    const done = e.sets.filter(x => x.completed);
                    doneSets += done.length;
                    done.forEach(x => { if (x.type === 'working') vol += (parseFloat(x.weight) || 0) * (parseInt(x.reps, 10) || 0) * toLb; });
                    return { exerciseId: e.substitution ? e.substitution.exerciseId : e.exerciseId, name: e.substitution ? e.substitution.name : e.name,
                        prescribedName: e.name, substituted: !!e.substitution, substitutionOrigin: e.substitution ? e.substitution.origin : null, prescribed: e.prescribed,
                        sets: done.map(x => ({ setNumber: x.setNumber, type: x.type, weight: parseFloat(x.weight) || 0, unit, reps: parseInt(x.reps, 10) || 0, rpe: x.rpe === '' ? null : parseFloat(x.rpe) })) };
                }).filter(e => e.sets.length);
                if (!doneSets) { triggerToast('Nothing to log', 'Complete at least one set, or discard the workout.'); return; }
                const completedDate = todayStr();
                const log = { id: `log-${sess.id}`, sessionId: sess.id, date: completedDate, workoutName: sess.workoutName, durationMin: Math.max(1, Math.round(elapsedSeconds / 60)),
                    totalVolumeLb: Math.round(vol), programId: sess.program.programId, programName: sess.program.programName, week: sess.program.week, day: sess.program.day,
                    sessionKey: sess.program.key, plannedDate: sess.program.plannedDate, completedDate, exercises: exLogs };
                setWorkoutLogs(prev => prev.some(l => l.sessionId === sess.id) ? prev : [log, ...prev]);
                setLibrary(prev => {
                    const pr = prev.progress[sess.program.programId] || { status: 'in_progress' };
                    const sessions = { ...(pr.sessions || {}), [sess.program.key]: { ...((pr.sessions || {})[sess.program.key] || {}), status: 'completed', completedDate, logId: log.id } };
                    const prog = prev.programs[sess.program.programId];
                    const all = prog ? buildSessions(prog, { ...pr, sessions }) : [];
                    const complete = all.length > 0 && all.every(x => x.status === 'completed');
                    return { ...prev, progress: { ...prev.progress, [sess.program.programId]: { ...pr, sessions, status: complete ? 'completed' : 'in_progress' } } };
                });
                setActiveSession(null); setWorkoutOpen(false); setRestEndsAt(null);
                triggerToast('Workout Completed!', `Logged ${doneSets} set(s) for ${sess.workoutName}.`);
            };
            const requestFinish = () => {
                if (!activeSession || !activeSession.program) return finishActiveWorkout();
                const left = activeSession.exercises.reduce((n, e) => n + e.sets.filter(x => !x.completed && x.type === 'working').length, 0);
                if (left > 0) setConfirmDialog({ title: 'Finish with sets remaining?', body: `${left} working set(s) are not checked off. They will not be logged, and only the work you completed is saved.`, confirmLabel: 'Finish workout', onConfirm: finishProgramWorkout });
                else finishProgramWorkout();
            };

            const renderProgramExercise = (item, exIdx) => {
                const pr = item.prescribed;
                const display = item.substitution ? item.substitution.name : item.name;
                const prev = lastPerformance(display);
                return (
                    <div key={exIdx} className="bg-[#101C2B] border border-[#203147] rounded-2xl p-4 space-y-3">
