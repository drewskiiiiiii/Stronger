                        <div className="flex items-start justify-between gap-2">
                            <div className="min-w-0">
                                <div className="text-[10px] text-[#8FA2B8]">Exercise {exIdx + 1} of {activeSession.exercises.length}</div>
                                <h3 className="text-sm font-bold text-white">{display}</h3>
                                {item.substitution && <div className="text-[10px] text-[#F59E0B]">Your substitution · prescribed: {item.name}</div>}
                            </div>
                            <button onClick={() => setSubModalIdx(exIdx)} aria-label="Substitute exercise" className="min-w-[44px] min-h-[44px] rounded-lg bg-[#142235] text-[#8FA2B8] text-base shrink-0">⇄</button>
                        </div>
                        <div className="bg-[#080E16] border border-[#203147] rounded-xl p-2.5 text-[11px] space-y-0.5">
                            <div className="text-[#8FA2B8] uppercase text-[9px] font-bold tracking-wide">Prescribed by program</div>
                            <div className="text-white font-bold">{pr.workingSets ?? '?'} × {pr.reps ?? '?'}{pr.warmupSets ? ` · ${pr.warmupSets} warm-up` : ''} · {intensityLabel(pr.intensity)}</div>
                            {pr.notes && <div className="text-[#C7D3E0] leading-snug">{pr.notes}</div>}

                                </div>

                                <h1 className="text-xs font-black tracking-wider text-white">STRONGER</h1>

                                </select>
                            </div>
                            <div onClick={() => setActiveNav('Settings')} className="w-8 h-8 rounded-xl bg-[#1685F8] text-white font-bold flex items-center justify-center text-xs shadow cursor-pointer">
                                {userSettings.name[0]}
                            </div>
                        </div>
                    </header>

                    {/* ACTIVE WORKOUT OVERLAY (Optimized for gym thumb usage) */}
                    {activeSession && workoutOpen && (
                        <div className="fixed inset-0 z-50 bg-[#080E16]/95 backdrop-blur-xl flex flex-col p-4 overflow-y-auto safe-top safe-bottom">
                            <div className="max-w-xl mx-auto w-full space-y-4">
                                <div className="bg-[#101C2B] border border-[#203147] rounded-2xl p-4 flex items-center justify-between gap-3 sticky top-0 z-20 shadow-xl">
                                    <div>
                                        <div className="text-[10px] font-bold uppercase tracking-wider text-[#1685F8]">Active Workout</div>
                                        <h2 className="text-lg font-black text-white">{activeSession.workoutName}</h2>
                                        {activeSession.program && <div className="text-[11px] text-[#8FA2B8]">{activeSession.program.programName} · Week {activeSession.program.week} · Day {activeSession.program.day}</div>}

                                            <span>Time: <strong className="text-white tabular-nums">{Math.floor(elapsedSeconds / 60)}m {elapsedSeconds % 60}s</strong></span>
                                            <span>·</span>
                                            <span>Rest: <strong className="text-[#31D583] tabular-nums">{fmtClock(timerSeconds)}</strong></span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => { setWorkoutOpen(false); setActiveNav('Home'); }} aria-label="Back to Home, keep workout running" className="min-h-[44px] px-3 rounded-xl bg-[#142235] border border-[#203147] text-white text-xs font-bold">⌂ Home</button>

                                </div>

                                <div className="space-y-4">

                                                        <img src={ex?.thumbnail} alt={ex?.name} className="w-10 h-10 rounded-lg object-cover border border-[#203147]" />

                                                            <h3 className="text-sm font-bold text-white">{ex?.name}</h3>
                                                            <p className="text-[11px] text-[#8FA2B8]">{ex?.primaryMuscle} · {ex?.equipment}</p>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => setSwapModalConfig({ mode: 'exercise', dayId: activeSession.dayId, exerciseId: item.exerciseId, activeExIdx: exIdx })} className="p-1.5 rounded-lg bg-[#142235] text-[#1685F8] text-xs">

                                                    </button>
                                                </div>

                                                                        setActiveSession(prev => {

                                                                            updated[exIdx].sets[setIdx].actualWeightLb = val;
                                                                            return { ...prev, exercises: updated };

                                                                <div className="flex items-center gap-1">

                                                                        const val = Number(e.target.value);
                                                                        setActiveSession(prev => {
                                                                            const updated = [...prev.exercises];
                                                                            updated[exIdx].sets[setIdx].actualReps = val;
                                                                            return { ...prev, exercises: updated };
                                                                        });
                                                                    }} className="w-12 bg-[#101C2B] border border-[#203147] rounded px-1.5 py-1 text-center text-xs text-white tabular-nums font-bold" />
                                                                    <span className="text-[10px] text-[#8FA2B8]">reps</span>
                                                                </div>

                                                                    setActiveSession(prev => {
                                                                        const updated = [...prev.exercises];
                                                                        updated[exIdx].sets[setIdx].completed = !updated[exIdx].sets[setIdx].completed;
                                                                        return { ...prev, exercises: updated };
                                                                    });
                                                                    if (!setObj.completed) startRest(item.restSeconds || 90);
                                                                }} className={`p-2 rounded-lg cursor-pointer ${setObj.completed ? 'bg-[#31D583] text-[#080E16]' : 'bg-[#142235] text-[#8FA2B8]'}`}>
                                                                    <i data-lucide="check" className="w-4 h-4"></i>
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MAIN CONTAINER */}

                            <div className="space-y-5">
                                {activeProgram && (
                                    <div className="bg-[#101C2B] border border-[#1685F8]/40 rounded-2xl p-4 space-y-2">
                                        <div className="text-[10px] font-bold uppercase tracking-wider text-[#1685F8]">Active program · {activeProgram.name}</div>

                                            <div className="text-sm font-black text-white">Week {nextProgramSession.week} · Day {nextProgramSession.day} · {nextProgramSession.label}</div>

                                                <button onClick={() => startProgramWorkout(nextProgramSession)} className="flex-1 min-h-[44px] rounded-xl bg-[#1685F8] text-white text-xs font-bold">{activeSession ? 'Return to workout' : 'Start workout'}</button>
                                                <button onClick={() => setActiveNav('Calendar')} className="min-h-[44px] px-4 rounded-xl bg-[#142235] border border-[#203147] text-white text-xs font-bold">Calendar</button>
                                            </div>
                                        </>) : <div className="text-xs text-[#8FA2B8]">No pending workouts left in this program.</div>}
                                    </div>
                                )}

                                {/* HERO WORKOUT CARD */}
                                <div className="relative rounded-2xl overflow-hidden border border-[#203147] bg-[#101C2B] shadow-xl">
                                    <div className="absolute inset-0 z-0">
                                        <img src={IMAGES.heroDeadlift} alt="Hero athlete" className="w-full h-full object-cover opacity-35" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-[#080E16] via-[#080E16]/80 to-transparent"></div>
                                    </div>
                                    <div className="relative z-10 p-5 space-y-4">
                                        <div className="flex items-center justify-between">
                                            <span className="px-2.5 py-0.5 rounded-full bg-[#1685F8]/20 text-[#1685F8] border border-[#1685F8]/30 text-[10px] font-extrabold uppercase tracking-widest">Today's Workout</span>
                                            <span className="text-[11px] text-[#8FA2B8] font-medium">{todaysWorkout.durationMin} min</span>
                                        </div>
                                        <div>
                                            <h2 className="text-xl font-black text-white tracking-tight">{todaysWorkout.name}</h2>
                                            <p className="text-xs text-[#A4B3C5] font-medium mt-0.5">{todaysWorkout.emphasis}</p>
                                        </div>
                                        <div className="flex items-center gap-2 pt-1">
                                            <button onClick={() => startWorkoutSession(todaysWorkout)} className="flex-1 py-3 rounded-xl bg-[#1685F8] hover:bg-[#2992FF] text-white font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg shadow-[#1685F8]/30 cursor-pointer">
                                                <i data-lucide="play" className="w-4 h-4 fill-white"></i><span>Start Workout</span>
                                            </button>
                                            <button onClick={() => setSwapModalConfig({ mode: 'day', dayId: todaysWorkout.id })} className="px-3.5 py-3 rounded-xl bg-[#142235] text-[#31D583] border border-[#203147] text-xs font-semibold flex items-center gap-1.5 cursor-pointer">
                                                <i data-lucide="refresh-cw" className="w-4 h-4"></i><span>Adapt</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* 2x2 SUMMARY METRICS */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="p-3.5 rounded-xl bg-[#101C2B] border border-[#203147] space-y-2">
                                        <div className="flex items-center justify-between text-[11px] text-[#8FA2B8]">
                                            <span>Current Program</span><i data-lucide="layers" className="w-3.5 h-3.5 text-[#1685F8]"></i>
                                        </div>
                                        <div className="text-xs font-bold text-white truncate">{program.name}</div>
                                        <div className="w-full bg-[#080E16] h-1.5 rounded-full overflow-hidden">
                                            <div className="bg-[#1685F8] h-full rounded-full" style={{ width: `${(program.currentWeek / program.totalWeeks) * 100}%` }}></div>
                                        </div>
                                    </div>

                                    <div className="p-3.5 rounded-xl bg-[#101C2B] border border-[#203147] space-y-2">
                                        <div className="flex items-center justify-between text-[11px] text-[#8FA2B8]">
                                            <span>Weekly Training</span><i data-lucide="check-circle-2" className="w-3.5 h-3.5 text-[#31D583]"></i>
                                        </div>
                                        <div className="flex items-baseline gap-1.5">
                                            <span className="text-lg font-extrabold text-white">4 / 5</span>
                                            <span className="text-[10px] text-[#8FA2B8]">Sessions</span>
                                        </div>
                                        <div className="flex items-center gap-1">
                                            {[true, true, true, true, false].map((done, i) => (
                                                <div key={i} className={`h-1.5 flex-1 rounded-full ${done ? 'bg-[#31D583]' : 'bg-[#203147]'}`}></div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                        <div className="flex items-center gap-2">
                                            <i data-lucide="dumbbell" className="w-4 h-4 text-[#1685F8]"></i>
                                            <h3 className="text-xs font-bold text-white uppercase tracking-wider">Today's Exercises</h3>
                                        </div>
                                        <button onClick={() => setShowPlanGeneratorModal(true)} className="text-[11px] font-semibold text-[#1685F8] flex items-center gap-1">
                                            <i data-lucide="sparkles" className="w-3 h-3"></i><span>New Plan</span>
                                        </button>
                                    </div>

                                    <div className="divide-y divide-[#182638]">
                                        {todaysWorkout.exercises.map(item => {
                                            const ex = exerciseMap[item.exerciseId];

                                            return (
                                                <div key={item.exerciseId} className="py-3 first:pt-0 last:pb-0 flex items-center justify-between gap-3">
                                                    <div className="flex items-center gap-3 min-w-0">
                                                        <div className="w-12 h-10 rounded-lg overflow-hidden border border-[#203147] shrink-0 bg-[#080E16]">
                                                            <img src={ex.thumbnail} alt={ex.name} className="w-full h-full object-cover" />
                                                        </div>
                                                        <div className="min-w-0">
                                                            <div className="text-xs font-bold truncate text-white">{ex.name}</div>
                                                            <div className="text-[10px] text-[#8FA2B8] tabular-nums mt-0.5">
                                                                {item.sets} sets × {item.reps} reps {item.targetWeightLb > 0 ? `· ${formatWeight(item.targetWeightLb, userSettings.unit, item.isWeightedAddition)}` : ''}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => setSwapModalConfig({ mode: 'exercise', dayId: todaysWorkout.id, exerciseId: item.exerciseId })} className="p-2 rounded-lg bg-[#142235] text-[#1685F8] shrink-0">
                                                        <i data-lucide="refresh-cw" className="w-3.5 h-3.5"></i>
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeNav === 'Workouts' && (
                            <div className="space-y-4">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-base font-black text-white">Workouts</h2>
                                    <button onClick={() => setShowPlanGeneratorModal(true)} className="px-3 py-1.5 rounded-lg bg-[#1685F8] text-white text-xs font-bold">Generate Plan</button>
                                </div>
                                <div className="space-y-3">
                                    {program.days.map(day => (
                                        <div key={day.id} className="bg-[#101C2B] border border-[#203147] rounded-xl p-4 space-y-3">
                                            <div className="flex items-center justify-between">
                                                <span className="px-2 py-0.5 rounded-full bg-[#1685F8]/15 text-[#1685F8] text-[9px] font-bold uppercase">{day.location}</span>
                                                <span className="text-[11px] text-[#8FA2B8]">{day.durationMin} min</span>
                                            </div>
                                            <div>
                                                <h3 className="text-sm font-bold text-white">{day.name}</h3>
                                                <p className="text-[11px] text-[#8FA2B8]">{day.emphasis}</p>
                                            </div>
                                            <div className="flex items-center gap-2 pt-2 border-t border-[#182638]">
                                                <button onClick={() => startWorkoutSession(day)} className="flex-1 py-2 rounded-lg bg-[#1685F8] text-white text-xs font-bold flex items-center justify-center gap-1.5">
                                                    <i data-lucide="play" className="w-3 h-3 fill-white"></i><span>Start Workout</span>
                                                </button>
                                                <button onClick={() => setSwapModalConfig({ mode: 'day', dayId: day.id })} className="px-3 py-2 rounded-lg bg-[#142235] text-[#31D583] text-xs font-semibold flex items-center gap-1">
                                                    <i data-lucide="refresh-cw" className="w-3 h-3"></i><span>Adapt</span>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeNav === 'Program' && openProgramId && library.programs[openProgramId] && (
                            <ProgramDetail program={library.programs[openProgramId]} state={progressOf(openProgramId)} isActive={library.activeProgramId === openProgramId} unit={userSettings.unit}
                                onBack={() => setOpenProgramId(null)} onRemove={() => removeProgram(openProgramId)}>
                                {(() => {
                                    const st = progressOf(openProgramId).status, id = openProgramId;
                                    const btn = 'w-full min-h-[48px] rounded-xl text-sm font-black ';
                                    if (st === 'not_started') return <button onClick={() => requestStartProgram(id)} className={btn + 'bg-[#1685F8] text-white'}>Start Program</button>;
                                    if (st === 'completed') return <div className="text-xs font-bold text-[#31D583]">✓ All workouts completed</div>;
                                    return (
                                        <div className="flex gap-2">
                                            <button onClick={() => resumeProgram(id)} className={btn + 'flex-1 bg-[#1685F8] text-white'}>Resume Program</button>
                                            {st === 'in_progress' && <button onClick={() => pauseProgram(id)} className="min-h-[48px] px-4 rounded-xl bg-[#142235] border border-[#203147] text-white text-xs font-bold">Pause</button>}
                                        </div>
                                    );
                                })()}
                            </ProgramDetail>
                        )}

                        {activeNav === 'Program' && !(openProgramId && library.programs[openProgramId]) && (
                            <div className="space-y-4">
                                <div>
                                    <h2 className="text-lg font-black text-white">Program Library</h2>
                                    <p className="text-[11px] text-[#8FA2B8] mt-0.5">Import your Jeff Nippard program PDFs. Each program is followed exactly as written.</p>
                                </div>
                                <button onClick={() => pdfInputRef.current && pdfInputRef.current.click()} disabled={importing} className="w-full min-h-[48px] rounded-xl bg-[#1685F8] text-white text-sm font-black disabled:opacity-60">{importing ? 'Reading PDF…' : '＋ Import program PDF(s)'}</button>
                                <input ref={pdfInputRef} type="file" accept="application/pdf,.pdf" multiple className="hidden" onChange={e => { handlePdfFiles(e.target.files); e.target.value = ''; }} />
                                {importReport && (
                                    <div className="bg-[#101C2B] border border-[#203147] rounded-xl p-3 space-y-1.5">
                                        {importReport.map((r, i) => <div key={i} className={`text-[11px] leading-snug ${r.ok ? 'text-[#31D583]' : 'text-[#F43F5E]'}`}>{r.ok ? '✓' : '✕'} {r.file}: {r.msg}</div>)}
                                        <button onClick={() => setImportReport(null)} className="text-[10px] text-[#8FA2B8] min-h-[32px]">Dismiss</button>
                                    </div>
                                )}
                                {Object.keys(library.programs).length > 1 && (
                                    <input type="search" value={libraryQuery} onChange={e => setLibraryQuery(e.target.value)} placeholder="Search programs" className="w-full min-h-[44px] bg-[#101C2B] border border-[#203147] rounded-xl px-3 text-white" />
                                )}
                                {Object.keys(library.programs).length === 0 && !importing && (
                                    <div className="bg-[#101C2B] border border-dashed border-[#203147] rounded-2xl p-6 text-center text-xs text-[#8FA2B8]">No programs imported yet. Tap “Import program PDF(s)” to add one.</div>
                                )}
                                {Object.values(library.programs).filter(pr => pr.name.toLowerCase().includes(libraryQuery.toLowerCase())).map(pr => (
                                    <ProgramCard key={pr.id} program={pr} state={progressOf(pr.id)} isActive={library.activeProgramId === pr.id} onOpen={() => setOpenProgramId(pr.id)} />
                                ))}
                                <h2 className="text-base font-black text-white pt-2">Built-in plan: {program.name}</h2>
                                <div className="bg-[#101C2B] border border-[#203147] rounded-xl p-4 space-y-3">
                                    <div className="text-xs font-bold text-white">Periodized Weeks</div>
                                    <div className="grid grid-cols-4 gap-2">
                                        {Array.from({ length: program.totalWeeks }).map((_, i) => {
                                            const wkNum = i + 1;
                                            const isCurrent = wkNum === program.currentWeek;
                                            return (
                                                <div key={wkNum} onClick={() => setProgram(prev => ({ ...prev, currentWeek: wkNum }))} className={`p-2.5 rounded-lg border text-center cursor-pointer ${isCurrent ? 'bg-[#1685F8] border-[#1685F8] text-white font-extrabold' : 'bg-[#080E16] border-[#203147] text-[#8FA2B8]'}`}>
                                                    <div className="text-[9px] uppercase">Wk</div>
                                                    <div className="text-sm font-black">{wkNum}</div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeNav === 'Progress' && <ProgramProgress key={library.activeProgramId || 'none'} library={library} workoutLogs={workoutLogs} unit={userSettings.unit} />}

                        {activeNav === 'Nutrition' && (
                            <div className="space-y-4">
                                <h2 className="text-base font-black text-white">Nutrition</h2>
                                <div className="bg-[#101C2B] border border-[#203147] rounded-xl p-4 space-y-3">
                                    <div className="text-xs font-bold text-white">Macros Today</div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="bg-[#080E16] p-3 rounded-lg border border-[#203147] text-center">
                                            <div className="text-lg font-black text-white">1,850</div>
                                            <div className="text-[10px] text-[#8FA2B8]">of 2,400 kcal</div>
                                        </div>
                                        <div className="bg-[#080E16] p-3 rounded-lg border border-[#203147] text-center">
                                            <div className="text-lg font-black text-white">145g</div>
                                            <div className="text-[10px] text-[#8FA2B8]">Protein (Goal 180g)</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeNav === 'Recovery' && (
                            <div className="space-y-4">
                                <h2 className="text-base font-black text-white">Recovery</h2>
                                <div className="bg-[#101C2B] border border-[#203147] rounded-xl p-4 space-y-3">
                                    <div className="text-xs font-bold text-white">Sleep Biometrics</div>
                                    <div className="bg-[#080E16] p-3 rounded-lg border border-[#203147] flex items-center justify-between">
                                        <div>
                                            <div className="text-xs text-[#8FA2B8]">Duration</div>
                                            <div className="text-sm font-bold text-white">7h 28m</div>
                                        </div>
                                        <div>
                                            <div className="text-xs text-[#8FA2B8]">Score</div>
                                            <div className="text-sm font-bold text-[#31D583]">82 / 100</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeNav === 'Calendar' && (
                            <CalendarView program={activeProgram} prog={activeProg} sessions={activeSessions} logs={workoutLogs} hasActiveWorkout={!!activeSession}
                                onStart={startProgramWorkout} onReschedule={rescheduleSession} onSkip={skipSession}
                                onUnskip={(sess) => patchProgress(library.activeProgramId, p => ({ ...p, sessions: { ...p.sessions, [sess.key]: { ...(p.sessions || {})[sess.key], status: 'planned' } } }))}
                                onOpenProgram={() => setActiveNav('Program')} />
                        )}

                        {activeNav === 'Settings' && (
                            <div className="space-y-4">
                                <h2 className="text-base font-black text-white">Settings</h2>
                                <div className="bg-[#101C2B] border border-[#203147] rounded-xl p-4 space-y-3">
                                    <div>
                                        <label className="text-[11px] text-[#8FA2B8] block mb-1">Athlete Name</label>
                                        <input type="text" value={userSettings.name} onChange={e => setUserSettings({ ...userSettings, name: e.target.value })} className="w-full bg-[#080E16] border border-[#203147] rounded-lg px-3 py-2 text-white text-xs" />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-[#8FA2B8] block mb-1">Weight Unit</label>
                                        <select value={userSettings.unit} onChange={e => setUserSettings({ ...userSettings, unit: e.target.value })} className="w-full bg-[#080E16] border border-[#203147] rounded-lg px-3 py-2 text-white text-xs">
                                            <option value="lb">Pounds (lb)</option>
                                            <option value="kg">Kilograms (kg)</option>
                                        </select>
                                    </div>
                                    <div className="pt-3 border-t border-[#203147] space-y-2">
                                        <div className="text-xs font-bold text-white">My equipment</div>
                                        <p className="text-[11px] text-[#8FA2B8]">Used to flag program exercises you may not be able to do. You choose any substitutions; nothing is changed automatically.</p>
                                        <div className="grid grid-cols-2 gap-2">
                                            {EQUIPMENT_OPTIONS.map(eq => { const on = ownedEquipment.includes(eq); return (
                                                <button key={eq} onClick={() => setUserSettings({ ...userSettings, equipment: on ? ownedEquipment.filter(x => x !== eq) : [...ownedEquipment, eq] })} className={`min-h-[44px] rounded-xl border text-xs font-bold ${on ? 'bg-[#1685F8] border-[#1685F8] text-white' : 'bg-[#080E16] border-[#203147] text-[#8FA2B8]'}`}>{on ? '✓ ' : ''}{eq}</button>); })}
                                        </div>
                                    </div>
                                    <div className="pt-3 border-t border-[#203147] space-y-2">
                                        <div className="text-xs font-bold text-white">Backup</div>
                                        <p className="text-[11px] text-[#8FA2B8]">Data is stored only in this browser on this device (no cloud sync). Export a backup to keep it safe.</p>
                                        <div className="flex gap-2">
                                            <button onClick={exportBackup} className="flex-1 min-h-[44px] rounded-xl bg-[#1685F8] text-white text-xs font-bold">Export backup</button>
                                            <button onClick={() => importInputRef.current && importInputRef.current.click()} className="flex-1 min-h-[44px] rounded-xl bg-[#142235] border border-[#203147] text-white text-xs font-bold">Restore backup</button>
                                            <input ref={importInputRef} type="file" accept="application/json,.json" className="hidden" onChange={e => { importBackup(e.target.files[0]); e.target.value = ''; }} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* IPHONE BOTTOM TAB BAR (Thumb friendly navigation) */}
                    <div className="fixed bottom-0 left-0 right-0 z-40">
                    {activeSession && !workoutOpen && (
                        <button onClick={() => setWorkoutOpen(true)} aria-label="Return to active workout" className="w-full flex items-center justify-between gap-3 px-4 min-h-[48px] bg-[#1685F8] text-white text-left">
                            <span className="flex items-center gap-2 min-w-0">
                                <span className="w-2 h-2 rounded-full bg-white animate-pulse shrink-0"></span>
                                <span className="text-xs font-black truncate">{activeSession.workoutName}</span>
                            </span>
                            <span className="flex items-center gap-3 shrink-0 text-xs tabular-nums font-bold">
                                <span>{Math.floor(elapsedSeconds / 60)}:{String(elapsedSeconds % 60).padStart(2, '0')}</span>
                                {timerRunning && <span className="px-1.5 py-0.5 rounded bg-white/20">Rest {fmtClock(timerSeconds)}</span>}
                                <span>Resume ›</span>
                            </span>
                        </button>
                    )}
                    <nav aria-label="Bottom Navigation" className="bg-[#0D1622]/95 backdrop-blur-xl border-t border-[#203147] px-2 py-1.5 flex items-center justify-around safe-bottom">
                        {[
                            { id: 'Home', label: 'Home', icon: 'home' },
                            { id: 'Workouts', label: 'Workouts', icon: 'dumbbell' },
                            { id: 'Program', label: 'Program', icon: 'layers' },
                            { id: 'Calendar', label: 'Calendar', icon: 'calendar' },
                            { id: 'Progress', label: 'Progress', icon: 'bar-chart-3' },
                            { id: 'Nutrition', label: 'Nutrition', icon: 'utensils' }
                        ].map(item => {
                            const isActive = activeNav === item.id;
                            return (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveNav(item.id)}
                                    className={`flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all cursor-pointer ${
                                        isActive ? 'text-[#1685F8]' : 'text-[#8FA2B8] hover:text-white'
                                    }`}
                                >
                                    <i data-lucide={item.icon} className="w-5 h-5"></i>
                                    <span className="text-[10px] font-semibold mt-0.5">{item.label}</span>
                                </button>
                            );
                        })}
                    </nav>
                    </div>

                    {confirmDiscard && (
                        <div className="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4">
                            <div className="bg-[#101C2B] border border-[#203147] rounded-2xl max-w-sm w-full p-5 space-y-4">
                                <h3 className="text-sm font-bold text-white">Discard this workout?</h3>
                                <p className="text-xs text-[#8FA2B8]">All sets logged in this session will be lost. Nothing will be saved to your history.</p>
                                <div className="flex gap-2">
                                    <button onClick={() => setConfirmDiscard(false)} className="flex-1 min-h-[44px] rounded-xl bg-[#142235] text-white text-xs font-bold">Keep Workout</button>
                                    <button onClick={() => { setActiveSession(null); setWorkoutOpen(false); setRestEndsAt(null); setConfirmDiscard(false); }} className="flex-1 min-h-[44px] rounded-xl bg-[#F43F5E] text-white text-xs font-black">Discard</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {startSheetId && library.programs[startSheetId] && <StartProgramSheet program={library.programs[startSheetId]} owned={ownedEquipment} onCancel={() => setStartSheetId(null)} onConfirm={(cfg) => activateProgram(startSheetId, cfg)} />}
                    {subModalIdx !== null && activeSession && activeSession.exercises[subModalIdx] && (
                        <SubstituteModal item={activeSession.exercises[subModalIdx]} library={exercises} onClose={() => setSubModalIdx(null)}
                            onPick={(sub) => setSubstitution(subModalIdx, sub)} onRestore={() => setSubstitution(subModalIdx, null)} />
                    )}
                    {confirmDialog && (
                        <div className="fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4">
                            <div className="bg-[#101C2B] border border-[#203147] rounded-2xl max-w-sm w-full p-5 space-y-4">
                                <h3 className="text-sm font-bold text-white">{confirmDialog.title}</h3>
                                <p className="text-xs text-[#8FA2B8]">{confirmDialog.body}</p>
                                <div className="flex gap-2">
                                    <button onClick={() => setConfirmDialog(null)} className="flex-1 min-h-[44px] rounded-xl bg-[#142235] text-white text-xs font-bold">Cancel</button>
                                    <button onClick={() => { const fn = confirmDialog.onConfirm; setConfirmDialog(null); fn(); }} className={`flex-1 min-h-[44px] rounded-xl text-white text-xs font-black ${confirmDialog.danger ? 'bg-[#F43F5E]' : 'bg-[#1685F8]'}`}>{confirmDialog.confirmLabel}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODALS */}
                    {swapModalConfig && (
                        <div className="fixed inset-0 z-50 bg-black/80 flex items-end md:items-center justify-center p-0 md:p-4">
                            <div className="bg-[#101C2B] border-t md:border border-[#203147] rounded-t-3xl md:rounded-2xl max-w-lg w-full p-5 space-y-4 max-h-[85vh] overflow-y-auto safe-bottom">
                                <div className="flex items-center justify-between pb-3 border-b border-[#203147]">
                                    <h3 className="text-sm font-bold text-white">{swapModalConfig.mode === 'day' ? 'Equipment Adapter' : 'Movement Substitution'}</h3>
                                    <button onClick={() => setSwapModalConfig(null)} className="p-1.5 bg-[#142235] text-[#8FA2B8] rounded-lg"><i data-lucide="x" className="w-4 h-4"></i></button>
                                </div>
                                {swapModalConfig.mode === 'day' ? (
                                    <div className="space-y-2.5">
                                        {[
                                            { key: 'dumbbells_only', title: 'Dumbbells & Bench', desc: 'Convert barbell lifts to dumbbells.' },
                                            { key: 'bodyweight_minimal', title: 'Bodyweight & Pull-Up Bar', desc: 'Convert to calisthenics.' },
                                            { key: 'barbell_rack', title: 'Barbell & Rack', desc: 'Standard barbell lifts.' }
                                        ].map(prof => (
                                            <div key={prof.key} onClick={() => handleAdaptEntireWorkoutByEquipment(swapModalConfig.dayId, prof.key)} className="p-3 rounded-xl bg-[#080E16] border border-[#203147] cursor-pointer flex items-center justify-between">
                                                <div>
                                                    <div className="text-xs font-bold text-white">{prof.title}</div>
                                                    <div className="text-[10px] text-[#8FA2B8]">{prof.desc}</div>
                                                </div>
                                                <i data-lucide="chevron-right" className="w-4 h-4 text-[#8FA2B8]"></i>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {getSimilarAlternatives(swapModalConfig.exerciseId).map(altEx => (
                                            <div key={altEx.id} onClick={() => handleReplaceSingleExercise(altEx.id)} className="p-2.5 rounded-xl bg-[#080E16] border border-[#203147] cursor-pointer flex items-center justify-between">
                                                <div className="flex items-center gap-2.5">
                                                    <img src={altEx.thumbnail} alt={altEx.name} className="w-10 h-9 rounded-lg object-cover" />
                                                    <div>
                                                        <div className="text-xs font-bold text-white">{altEx.name}</div>
                                                        <div className="text-[10px] text-[#8FA2B8]">{altEx.equipment}</div>
                                                    </div>
                                                </div>
                                                <span className="text-xs font-bold text-[#1685F8]">Select</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {showPlanGeneratorModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 flex items-end md:items-center justify-center p-0 md:p-4">
                            <div className="bg-[#101C2B] border-t md:border border-[#203147] rounded-t-3xl md:rounded-2xl max-w-md w-full p-5 space-y-4 safe-bottom">
                                <div className="flex items-center justify-between pb-3 border-b border-[#203147]">
                                    <h3 className="text-sm font-bold text-white">Generate Plan</h3>
                                    <button onClick={() => setShowPlanGeneratorModal(false)} className="p-1.5 bg-[#142235] text-[#8FA2B8] rounded-lg"><i data-lucide="x" className="w-4 h-4"></i></button>
                                </div>
                                <div className="space-y-3">
                                    <div>
                                        <label className="text-[11px] text-[#8FA2B8] block mb-1">Duration (Weeks)</label>
                                        <select value={planGenConfig.weeks} onChange={e => setPlanGenConfig({ ...planGenConfig, weeks: Number(e.target.value) })} className="w-full bg-[#080E16] border border-[#203147] rounded-lg px-3 py-2 text-white text-xs">
                                            <option value="4">4 Weeks</option>
                                            <option value="8">8 Weeks</option>
                                            <option value="12">12 Weeks</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-[#8FA2B8] block mb-1">Training Goal</label>
                                        <select value={planGenConfig.goal} onChange={e => setPlanGenConfig({ ...planGenConfig, goal: e.target.value })} className="w-full bg-[#080E16] border border-[#203147] rounded-lg px-3 py-2 text-white text-xs">
                                            <option value="Powerbuilding">Powerbuilding</option>
                                            <option value="Maximal Strength">Maximal Strength</option>
                                            <option value="Hypertrophy">Hypertrophy</option>
                                        </select>
                                    </div>
                                    <button onClick={handleGeneratePlan} className="w-full py-3 rounded-xl bg-[#1685F8] text-white text-xs font-bold shadow-lg shadow-[#1685F8]/25 cursor-pointer">Generate & Save Plan</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && (
                        <div className="fixed bottom-20 left-4 right-4 z-50 bg-[#101C2B] border border-[#1685F8] text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
                            <div className="w-2 h-2 rounded-full bg-[#1685F8] animate-ping"></div>
                            <div>
                                <div className="text-xs font-bold">{toast.title}</div>
                                <div className="text-[10px] text-[#8FA2B8]">{toast.message}</div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
        setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 100);
    </script>
</body>
</html>
